<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>親子教育架構・練習</title>
<style>
/*STYLES*/
</style></head>
<body><a class="skip-link" href="#app">跳到內容</a><div class="wrap">
<!--MASTHEAD-->
<main id="app" class="app" tabindex="-1"></main>
<footer class="page-footer"><span>親子教育架構 · 陪伴比完美更重要</span><span>每一步都是互動，不需要登入，資料只留在這個頁面</span></footer></div>
<script>window.FW_EMBED=/*FW*/;</script>
<script>/*GEN*/</script>
<script>
(function(){
const fw=window.FW_EMBED,PF=window.ParentingFramework;
const $=id=>document.getElementById(id),A=$('app');
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOMAIN={emotion:'情緒',behavior:'行為',interpersonal:'人際'};
const ICE=fw.core.iceberg.layers,F=fw.core.fourF,SEL=fw.core.sel,AUD=['elementary','junior','senior'];
(function(){const c=fw.core.colors;let l='',d='';
 Object.keys(c.fourF).forEach(k=>{l+='--f-'+k+':'+c.fourF[k].l+';';d+='--f-'+k+':'+c.fourF[k].d+';'});
 Object.keys(c.sel).forEach(k=>{l+='--s-'+k+':'+c.sel[k].l+';';d+='--s-'+k+':'+c.sel[k].d+';'});
 Object.keys(c.iceberg).forEach(k=>{l+='--i-'+k+':'+c.iceberg[k].bg.l+';--if-'+k+':'+c.iceberg[k].fg.l+';';d+='--i-'+k+':'+c.iceberg[k].bg.d+';--if-'+k+':'+c.iceberg[k].fg.d+';'});
 const s=document.createElement('style');
 s.textContent=':root{'+l+'}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){'+d+'}}:root[data-theme="dark"]{'+d+'}';document.head.appendChild(s);})();
const sitOf=id=>fw.situations.find(s=>s.id===id),fOf=id=>F.find(x=>x.id===id),selOf=id=>SEL.find(x=>x.id===id);
const iceBg=id=>'background:var(--i-'+id+');color:var(--if-'+id+')';
const chipI=(id,t)=>'<span class="chip" style="background:var(--i-'+id+');color:var(--if-'+id+');border:1px solid var(--line)">'+esc(t)+'</span>';
const chipF=(id,t)=>'<span class="chip" style="--c:var(--f-'+id+')">'+esc(t)+'</span>';
const chipS=(id,t)=>'<span class="chip" style="--c:var(--s-'+id+')">'+esc(t)+'</span>';
function ice(title,ic){const band=(i,cls)=>'<div class="band '+cls+'" style="'+iceBg(ICE[i].id)+'"><small>'+esc(ICE[i].label)+'</small>'+esc(ic[ICE[i].id])+'</div>';
 return '<div><h3>'+title+'</h3><div class="sky">'+band(0,'b1')+'</div><div class="wl"><span>水面</span></div><div class="sea">'+band(1,'b2')+band(2,'b3')+'</div></div>';}
const ul=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';

const S={view:'flow',aud:'junior',sit:'emotion_outburst',stage:0,mine:{},role:'parent',picks:{},resp:[],proj:false,agree:null,when:'明天'};
const ST=[
 {id:'open',n:'開場',tag:'為什麼是這個情境'},
 {id:'ido',n:'I do',tag:'冰山・先看自己'},
 {id:'youdo',n:'You do',tag:'冰山＋SEL・看見孩子'},
 {id:'wedo',n:'We do',tag:'4F・一起對話'},
 {id:'close',n:'約定',tag:'明天就能做的事'}];
const stageDef=id=>fw.core.stages.find(x=>x.id===id);
function plan(){return PF.buildPlan(fw,{situation:S.sit,audience:S.aud,resultsDisplay:'projector'});}
function setStage(i){S.stage=Math.max(0,Math.min(ST.length-1,i));draw();window.scrollTo({top:0});}
function topbar(extra){return '<div class="topbar"><button data-act="flow">← 回講師主線</button><span class="mut">'+(extra||'')+'</span></div>';}

function ctl(){
 return '<div class="ctlbar"><div><label for="sit">生活情境</label><select id="sit">'+fw.situations.map(x=>'<option value="'+x.id+'" '+(x.id===S.sit?'selected':'')+'>'+DOMAIN[x.domain]+'・'+esc(x.title)+'</option>').join('')+'</select></div>'
 +'<div><label>孩子年段</label><div class="seg2">'+AUD.map(a=>'<button data-aud="'+a+'" class="'+(S.aud===a?'primary':'')+'">'+esc(fw.audiences[a].label)+'</button>').join('')+'</div></div>'
 +'<div class="ctlbtns"><button data-act="proj" class="'+(S.proj?'primary':'')+'">投影大字</button><button data-act="survey">問卷統計</button></div></div>';}
function stepper(){return '<nav class="stepper" aria-label="講師主線">'+ST.map((x,i)=>'<button data-stage="'+i+'" class="'+(i===S.stage?'on':'')+(i<S.stage?' past':'')+'" '+(i===S.stage?'aria-current="step"':'')+'><span class="sn">'+(i+1)+'</span><b>'+esc(x.n)+'</b><small>'+esc(x.tag)+'</small></button>').join('')+'</nav>';}
function pager(){return '<div class="row2">'+(S.stage>0?'<button data-act="prev">← '+ST[S.stage-1].n+'</button>':'')+(S.stage<ST.length-1?'<button class="primary" data-act="next">'+ST[S.stage+1].n+' →</button>':'')+'</div>';}
const bridge=t=>'<div class="bridge"><span>承接語</span>'+esc(t)+'</div>';
function leader(def){return '<details class="lead" open><summary>講師帶領</summary><p class="mut" style="margin:6px 0">'+esc(def.purpose)+'</p>'+ul(def.leaderMoves)+'</details>';}
function ask(key,label,ph){return '<div class="audience"><label for="'+key+'">聽眾一句話：'+esc(label)+'</label><textarea id="'+key+'" rows="2" placeholder="'+esc(ph||'')+'">'+esc(S.mine[key]||'')+'</textarea></div>';}

function vFlow(){
 const p=plan(),s=sitOf(S.sit),au=s.byAudience[S.aud],a=fw.audiences[S.aud],id=ST[S.stage].id;
 let h=ctl()+stepper();
 if(id==='open'){
  const ch=p.layers.coherence.chain,col=['behavior','feeling','belief'];
  h+='<div class="card hero2"><p class="kicker">'+esc(DOMAIN[s.domain])+'・'+esc(a.label)+'</p><h2>'+esc(s.title)+'</h2><p class="big2">'+esc(p.layers.coherence.storyline)+'</p></div>'
  +'<div class="card"><p class="kicker">這一場的邏輯主線</p><p class="mut">同一個例子，從行為一路走到約定。每個階段回答上一個階段留下的問題。</p><div class="chain5">'
  +ch.map((c,i)=>'<div class="cl" style="'+(i<3?iceBg(col[i])+';border:1px solid var(--line)':i===3?'background:var(--s-self_management);color:var(--chipfg)':'background:var(--f-future);color:var(--chipfg)')+'"><small>'+esc(c.label)+'</small>'+esc(c.text)+'</div>').join('<span class="ar">→</span>')+'</div>'
  +'<div class="legend"><b>顏色</b>'+ICE.map(l=>chipI(l.id,l.label.split('（')[0])).join('')+chipS('self_management','SEL 能力')+chipF('future','約定')+'</div></div>'
  +'<div class="card"><p class="kicker">這個例子（貫穿全場）</p><div class="q">'+esc(au.example)+'</div>'+(p.extras.leadIn?'<p class="mut">'+esc(p.extras.leadIn)+'</p>':'')+'</div>'
  +'<div class="card"><p class="kicker">開場互動：先看全場的現況</p><p>請家長就孩子最近一個月的情況勾選。這個情境對應的題目：</p><div>'+Object.keys(s.surveyLink).map(g=>s.surveyLink[g].map(i=>'<span class="tag">'+esc(i)+'</span>').join('')).join('')+'</div><div class="row2"><button data-act="survey">看問卷統計與落差</button></div></div>'
  +bridge('先不急著處理孩子。我們從最容易被忽略的人開始：我們自己。');
 }
 if(id==='ido'){
  const d=stageDef('ido');
  h+='<div class="card"><p class="kicker">I do　先看自己</p><h2>'+esc(s.triggerForParent)+'</h2>'+leader(d)+'</div>'
  +'<div class="card"><p class="kicker">家長的冰山：我的反應從哪裡來</p>'+ice('',s.parentIceberg)+'<div class="note">'+esc(fw.core.iceberg.rule)+'</div></div>'
  +'<div class="card"><p class="kicker">講師示範</p><p><b>'+esc(s.idoModel)+'</b></p>'+(s.lecturerExperience&&s.lecturerExperience.status==='TODO'?'<p class="todo">'+esc(s.lecturerExperience.text)+'</p>':s.lecturerExperience?'<p>'+esc(s.lecturerExperience.text)+'</p>':'')+ask('ido','我通常怎麼做？','例如：我先深呼吸，再問他發生了什麼事')+'</div>'
  +bridge('看完自己的冰山，同一件事，孩子的水面下是什麼？');
 }
 if(id==='youdo'){
  const d=stageDef('youdo');
  h+='<div class="card"><p class="kicker">You do　看見孩子</p><h2>'+esc(au.example)+'</h2>'+leader(d)+'</div>'
  +'<div class="card"><p class="kicker">孩子的冰山</p>'+ice('',au.childIceberg)+'<div class="note">'+esc(fw.core.iceberg.interplay)+'</div><h3>可以這樣問孩子（'+esc(a.label)+'）</h3>'+ul(au.youDoQuestions)+ask('swap','孩子心裡可能在說…','先猜他的感受與需要，不評論對錯')+'</div>'
  +'<div class="card"><p class="kicker">SEL 五大核心：這個情境需要哪些能力</p><div class="sel5b">'+SEL.map(c=>'<div class="sc2" style="border-top:5px solid var(--s-'+c.id+')">'+chipS(c.id,c.label)+'<p>'+esc(s.selMap[c.id])+'</p></div>').join('')+'</div></div>'
  +'<div class="card"><p class="kicker">看見系統：不只看個人</p><div class="legend">'+fw.core.systemLayers.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div><p><b>'+esc((p.extras.system&&p.extras.system.question)||fw.core.systemQuestion)+'</b></p></div>'
  +'<div class="card"><p class="kicker">'+esc(a.label)+'的對話重點</p><p class="mut">'+esc(a.developmental)+'</p><p><b>家長角色：</b>'+esc(a.parentRole)+'</p>'+ul(a.language)+'</div>'
  +bridge('理解了兩座冰山，我們需要一個不傷人的順序來開口：4F。');
 }
 if(id==='wedo'){
  const d=stageDef('wedo');
  h+='<div class="card"><p class="kicker">We do　一起對話</p><h2>Facts → Feelings → Findings → Future</h2>'+leader(d)+'</div>'
  +'<div class="card"><p class="kicker">4F 如何對應冰山與 SEL</p><div class="f4t">'+p.layers.fourF.map((f,i)=>'<div class="f4r" style="--c:var(--f-'+f.id+')"><div class="f4h"><span class="n">'+(i+1)+'</span><b>'+esc(f.label)+'</b></div><div class="f4b"><p class="say">'+esc(s.wedoScript[f.id]||f.script)+'</p><p class="mut">'+esc(f.prompt)+'</p><div>'+chipI(f.icebergId,f.iceberg)+(f.selIds||[]).map(x=>chipS(x,selOf(x).label)).join('')+'</div><details><summary>提問與要避免的話</summary>'+ul(f.questions||[])+'<p class="mut">避免：'+esc(f.avoid)+'</p><p class="mut">'+esc(a.label)+'句型：'+esc(a.fourFStyle[f.id])+'</p></details></div></div>').join('')+'</div></div>'
  +'<div class="card"><p class="kicker">為什麼是這個順序</p><p>先還原事實，對方才不會防衛；先說自己的感受，才輪到對方；一起找到需要，約定才會有人遵守；最後才訂下一步。</p><div class="note">'+esc(fw.core.coherenceRules[1])+'</div></div>'
  +bridge('對話之後要有一件事真的改變。把它訂成明天就能做的約定。');
 }
 if(id==='close'){
  const opts=[{k:'a',t:au.future,tag:'本年段建議'},{k:'b',t:s.chain.agreement,tag:'重點：'+s.chain.skill}];
  h+='<div class="card"><p class="kicker">約定與收束</p><h2>把理解變成明天的一個小行動</h2><p class="mut">'+esc(a.contractStyle)+'</p><div class="choices">'
  +opts.map(o=>'<button class="choice '+(S.agree===o.k?'right':'')+'" data-agree="'+o.k+'"><small>'+esc(o.tag)+'</small>'+esc(o.t)+'</button>').join('')
  +'<button class="choice '+(S.agree==='c'?'right':'')+'" data-agree="c"><small>用自己的話寫</small>'+(S.agree==='c'?'<textarea id="mineag" rows="2" onclick="event.stopPropagation()" placeholder="時間、地點、誰、做什麼，何時檢討">'+esc(S.mine.mineag||'')+'</textarea>':'點這裡自己寫')+'</button></div>'
  +'<label for="when">什麼時候開始？</label><select id="when">'+['今天晚上','明天','這個週末','下週一'].map(w=>'<option '+(S.when===w?'selected':'')+'>'+w+'</option>').join('')+'</select></div>'
  +'<div class="card"><p class="kicker">本場收束的四句話</p>'+ul(p.extras.closing)+'<div class="note">'+esc(p.extras.referral)+'</div></div>'
  +(S.agree?'<div class="card"><p class="kicker">我的約定卡</p><div class="summary" id="sumtxt">'+esc(summary(s,au,a))+'</div><div class="row2"><button class="primary" data-act="copy">複製</button><button data-act="print">列印</button></div><p class="mut" id="copied"></p></div>':'');
 }
 return h+pager();}
function summary(s,au,a){const ag=S.agree==='a'?au.future:S.agree==='b'?s.chain.agreement:(S.mine.mineag||'（自己寫）');
 return '【親子約定卡】'+s.title+'（'+a.label+'）\n\n孩子的冰山\n・行為：'+au.childIceberg.behavior+'\n・感受與需求：'+au.childIceberg.feeling+'\n・價值信念：'+au.childIceberg.belief+'\n\n我的做法：'+(S.mine.ido||s.idoModel)+(S.mine.swap?'\n我猜孩子心裡在說：'+S.mine.swap:'')+'\n\n我會用 4F 開口\n'+F.map(f=>'・'+f.label+'：'+(s.wedoScript[f.id]||f.prompt)).join('\n')+'\n\n我的約定（'+S.when+'開始）\n'+ag+'\n\n提醒：'+s.referralNote;}

// 問卷
function ensurePicks(){fw.survey.groups.forEach(g=>{if(!S.picks[g.key])S.picks[g.key]=[];});}
function bar(col,label,p){const w=p==null?0:Math.round(p*100);return '<div class="bar2"><span class="t">'+label+'</span><span class="tr"><span class="fl" style="width:'+w+'%;background:'+col+'"></span></span><span class="v">'+(p==null?'—':w+'%')+'</span></div>';}
function vSurvey(){
 ensurePicks();const spec=PF.surveySpec(fw,S.role),t=PF.tally(fw,S.resp);
 let h=topbar('不記名，只存在這個頁面')+'<div class="card"><p class="kicker">1 / 2　我是…</p><div class="row2">'+fw.survey.respondents.map(r=>'<button data-act="role" data-r="'+r.id+'" class="'+(S.role===r.id?'primary':'')+'">'+esc(r.label)+'</button>').join('')+'</div><p class="mut">'+esc(spec.stem)+'</p>';
 spec.groups.forEach(g=>{h+='<h3>'+esc(g.name)+'</h3>'+g.items.map(i=>'<label class="chk"><input type="checkbox" data-g="'+g.key+'" data-v="'+esc(i.value)+'" '+(S.picks[g.key].indexOf(i.value)>-1?'checked':'')+'>'+esc(i.text)+'</label>').join('');});
 h+='<div class="row2"><button class="primary" data-act="submit">送出這一份</button><button data-act="demo">載入示範資料</button><button data-act="clear">清除全部</button></div><p class="mut">目前：家長 '+t.parent.total+' 份、學生 '+t.student.total+' 份</p></div>';
 if(!t.parent.total&&!t.student.total)return h+'<div class="card"><p class="mut">還沒有資料。先送出一份，或按「載入示範資料」。</p></div>';
 const cmp=PF.compare(fw,t),rec=PF.recommendFromSurvey(fw,t).slice(0,3),ins=PF.insights(fw,t).slice(0,4);
 const flat=[];cmp.forEach(g=>g.items.forEach(i=>{if(!i.none)flat.push(i);}));
 flat.sort((a,b)=>((b.parentPct||0)+(b.studentPct||0))-((a.parentPct||0)+(a.studentPct||0)));
 h+='<div class="card"><p class="kicker">2 / 2　結果</p><div class="q">今天先聊這三個情境</div>'
  +rec.map((r,i)=>'<div class="rk"><span class="n">'+(i+1)+'</span><div><b>'+esc(DOMAIN[r.domain])+'・'+esc(r.title)+'</b><div class="mut">'+r.evidence.map(e=>esc(e.item)+'（家長 '+(e.parentPct==null?'—':Math.round(e.parentPct*100)+'%')+'／學生 '+(e.studentPct==null?'—':Math.round(e.studentPct*100)+'%')+'）').join('；')+'</div><button data-act="sitgo" data-s="'+r.situation+'" style="margin-top:6px">練習這個情境 →</button></div></div>').join('')+'</div>'
  +'<div class="card"><div class="q">最常被勾選的前 6 項</div><p class="mut"><span style="color:var(--teal)">■</span> 家長　<span style="color:var(--amber)">■</span> 學生</p>'
  +flat.slice(0,6).map(i=>'<div style="margin:12px 0"><div>'+esc(i.item)+(i.tag==='student_more'?' <span class="tag warn">學生更多</span>':i.tag==='parent_more'?' <span class="tag warn">家長更多</span>':'')+'</div>'+bar('var(--teal)','家長',i.parentPct)+bar('var(--amber)','學生',i.studentPct)+'</div>').join('')+'</div>'
  +'<div class="card"><div class="q">看見落差</div>'+(ins.length?'<ul>'+ins.map(x=>'<li>'+esc(x.text)+'</li>').join('')+'</ul>':'<p class="mut">兩邊很接近，或某一邊還沒有資料。</p>')+'</div>';
 return h;}


function draw(){A.className='app'+(S.proj?' proj':'');A.innerHTML=S.view==='flow'?vFlow():vSurvey();}
A.addEventListener('input',e=>{const t=e.target;if(t.tagName==='TEXTAREA')S.mine[t.id]=t.value;});
A.addEventListener('change',e=>{const t=e.target;
 if(t.id==='sit'){S.sit=t.value;S.agree=null;return draw();}
 if(t.id==='when'){S.when=t.value;return draw();}
 if(t.dataset&&t.dataset.g){const arr=S.picks[t.dataset.g];const i=arr.indexOf(t.dataset.v);if(t.checked&&i<0)arr.push(t.dataset.v);if(!t.checked&&i>-1)arr.splice(i,1);}});
A.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.aud){S.aud=d.aud;S.agree=null;return draw();}
 if(d.stage!=null&&d.stage!==''){return setStage(+d.stage);}
 if(d.agree){S.agree=d.agree;return draw();}
 switch(d.act){
  case 'flow':S.view='flow';return draw();
  case 'prev':return setStage(S.stage-1);
  case 'next':return setStage(S.stage+1);
  case 'proj':S.proj=!S.proj;return draw();
  case 'survey':S.view='survey';draw();return window.scrollTo({top:0});
  case 'copy':{const t=$('sumtxt').textContent,ok=()=>{$('copied').textContent='已複製，可以貼到 LINE 或筆記。';};
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{$('copied').textContent='無法自動複製，請長按文字手動複製。';});else $('copied').textContent='無法自動複製，請長按文字手動複製。';return;}
  case 'print':return window.print();
  case 'role':S.role=d.r;return draw();
  case 'submit':{const pk={};fw.survey.groups.forEach(g=>{pk[g.key]=S.picks[g.key].slice();S.picks[g.key]=[];});S.resp.push({role:S.role,picks:pk});return draw();}
  case 'demo':S.resp=PF.demoResponses(fw,20,20);return draw();
  case 'clear':S.resp=[];fw.survey.groups.forEach(g=>S.picks[g.key]=[]);return draw();
  case 'sitgo':S.sit=d.s;S.agree=null;S.stage=0;S.view='flow';draw();return window.scrollTo({top:0});
 }
});
draw();
const tb=$('themeToggle');if(tb)tb.addEventListener('click',function(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.textContent=dark?'☀ 淺色模式':'◐ 深色模式';this.setAttribute('aria-pressed',String(dark));this.setAttribute('aria-label',dark?'切換為淺色模式':'切換為深色模式');});
})();
</script></body></html>
