<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>親子教育架構・練習</title>
<style>
/*STYLES*/
</style></head>
<body><a class="skip-link" href="#app">跳到內容</a><div class="wrap">
<!--MASTHEAD-->
<main id="app" class="app" tabindex="-1"></main>
<footer class="page-footer"><span>親子教育架構 · 陪伴比完美更重要</span><span>每一步都是互動，不需要登入，資料只留在這個頁面</span></footer></div>
<script>window.FW_EMBED=/*FW*/;</script>
<script>/*GEN*/</script>
<script>
(function(){
const fw=window.FW_EMBED,PF=window.ParentingFramework;
const $=id=>document.getElementById(id),A=$('app');
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOMAIN={emotion:'情緒',behavior:'行為',interpersonal:'人際'};
const DOMCOL={emotion:'var(--f-feelings)',behavior:'var(--f-facts)',interpersonal:'var(--f-future)'};
const ICE=fw.core.iceberg.layers,F=fw.core.fourF,SEL=fw.core.sel;
const AUD=['elementary','junior','senior'];
// 顏色
(function(){const c=fw.core.colors;let l='',d='';
 Object.keys(c.fourF).forEach(k=>{l+='--f-'+k+':'+c.fourF[k].l+';';d+='--f-'+k+':'+c.fourF[k].d+';'});
 Object.keys(c.sel).forEach(k=>{l+='--s-'+k+':'+c.sel[k].l+';';d+='--s-'+k+':'+c.sel[k].d+';'});
 Object.keys(c.iceberg).forEach(k=>{l+='--i-'+k+':'+c.iceberg[k].bg.l+';--if-'+k+':'+c.iceberg[k].fg.l+';';d+='--i-'+k+':'+c.iceberg[k].bg.d+';--if-'+k+':'+c.iceberg[k].fg.d+';'});
 const s=document.createElement('style');
 s.textContent=':root{'+l+'}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){'+d+'}}:root[data-theme="dark"]{'+d+'}';document.head.appendChild(s);})();
const sitOf=id=>fw.situations.find(s=>s.id===id);
const iceBg=id=>'background:var(--i-'+id+');color:var(--if-'+id+')';
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const chipI=(id,t)=>'<span class="chip" style="background:var(--i-'+id+');color:var(--if-'+id+');border:1px solid var(--line)">'+esc(t)+'</span>';
const chipF=(id,t)=>'<span class="chip" style="--c:var(--f-'+id+')">'+esc(t)+'</span>';
function ice(title,ic,upto){ // upto: 1..3 層
 const band=(i,cls)=>upto>i?'<div class="band '+cls+'" style="'+iceBg(ICE[i].id)+'"><small>'+esc(ICE[i].label)+'</small>'+esc(ic[ICE[i].id])+'</div>':'<div class="band '+cls+'" style="background:var(--track);color:var(--mut)"><small>'+esc(ICE[i].label)+'</small>？</div>';
 return (title?'<h3>'+title+'</h3>':'')+'<div class="sky">'+band(0,'b1')+'</div><div class="wl"><span>水面</span></div><div class="sea">'+band(1,'b2')+band(2,'b3')+'</div>';}

const S={view:'home',aud:'junior',sit:null,step:0,a:{},role:'parent',picks:{},resp:[],quiz:null};
const STEPS=['sit','story','ido','guess','match','order','commit','done'];
const STEPNAME={sit:'選情境',story:'看故事',ido:'I do 先看自己',guess:'You do 猜冰山',match:'You do 分層',order:'We do 排 4F',commit:'We do 約定',done:'我的約定卡'};
function go(v){S.view=v;draw();window.scrollTo({top:0,behavior:'smooth'});A.focus({preventScroll:true});}
function start(sit){S.sit=sit||null;S.step=sit?1:0;S.a={};S.view='practice';draw();window.scrollTo({top:0});}

function topbar(extra){return '<div class="topbar"><button data-act="home">← 回首頁</button><span class="mut">'+(extra||'')+'</span></div>';}

function vHome(){
 const ic=(p)=>'<span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg></span>';
 return '<section class="home"><div class="eyebrow">PARENTING & CONNECTION</div><h1>今天，想怎麼練習？</h1><p class="lead">選一個就好，每一步都能點、能猜、能玩。</p>'
 +'<div class="big3">'
 +'<button class="bigcard" data-act="practice">'+ic('<path d="M5 20 12 4l7 16M8 14h8"/>')+'<b>開始練習</b><span class="d">選一個生活情境，一步一步走完：看自己、猜孩子、排 4F、訂約定。約 10 分鐘。</span></button>'
 +'<button class="bigcard" data-act="games">'+ic('<rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 10v5M5.5 12.5h5M16 11h.01M18 14h.01"/>')+'<b>玩一玩</b><span class="d">三個 5 題小遊戲：冰山分層、4F 找位置、SEL 五核心。每題馬上有回饋。</span></button>'
 +'<button class="bigcard" data-act="survey">'+ic('<path d="M5 20V10M12 20V4M19 20v-7"/>')+'<b>問卷統計</b><span class="d">家長和學生各填一份，看見兩邊的落差，排出今天先聊哪個情境。</span></button>'
 +'</div><div class="linkrow"><button class="linkbtn" data-act="random">🎲 幫我隨機選一個情境開始</button><a class="linkbtn" href="full.html">看完整內容（六個層次總覽）→</a></div></section>';}

function progress(){const i=STEPS.indexOf(STEPS[S.step]);return '<div class="progress" aria-label="進度">'+STEPS.map((s,k)=>'<i class="'+(k<S.step?'done':k===S.step?'cur':'')+'"></i>').join('')+'</div>';}
function nav(next,label,disabled){return '<div class="row2">'+(S.step>0?'<button data-act="back">← 上一步</button>':'')+'<button class="primary" data-act="next" '+(disabled?'disabled':'')+'>'+(label||'下一步 →')+'</button></div>';}

function vPractice(){
 const id=STEPS[S.step],s=S.sit?sitOf(S.sit):null,au=s?s.byAudience[S.aud]:null;
 let h=topbar(s?esc(DOMAIN[s.domain])+'・'+esc(s.title)+'・'+esc(fw.audiences[S.aud].label):'')+progress()+'<div class="card"><p class="kicker">'+(S.step+1)+' / '+STEPS.length+'　'+STEPNAME[id]+'</p>';
 if(id==='sit'){
  h+='<div class="q">孩子現在是哪個年段？</div><div class="row2">'+AUD.map(a=>'<button data-aud="'+a+'" class="'+(S.aud===a?'primary':'')+'">'+esc(fw.audiences[a].label)+'<br><small>'+esc(fw.audiences[a].grades.split('（')[0])+'</small></button>').join('')+'</div>'
  +'<div class="q" style="margin-top:22px">今天想練習哪一種情況？</div><div class="sitgrid">'+fw.situations.map(x=>'<button class="sitcard" style="--dc:'+DOMCOL[x.domain]+'" data-sit="'+x.id+'"><span class="tg">'+esc(DOMAIN[x.domain])+'</span><b>'+esc(x.title)+'</b><small>'+esc(x.byAudience[S.aud].example.slice(0,34))+'…</small></button>').join('')+'</div></div>';
  return h;}
 if(id==='story'){
  h+='<div class="q">'+esc(au.example)+'</div><p class="mut">'+esc(s.storyline)+'</p>'
  +'<div class="q" style="font-size:16px">先想一想：你覺得孩子這時候最需要什麼？</div><div class="choices">'
  +['被聽完、被理解','被講道理、被糾正','被獨自留下、不要管'].map((t,i)=>'<button class="choice '+(S.a.story===i?(i===0?'right':'wrong'):'')+'" data-pick="story" data-v="'+i+'" '+(S.a.story!=null?'disabled':'')+'>'+esc(t)+'</button>').join('')+'</div>';
  if(S.a.story!=null)h+='<div class="note">'+(S.a.story===0?'很接近。':'有時候孩子需要空間，但先被聽見，通常更有幫助。')+'水面上的行為是「'+esc(s.chain.surface)+'」，水面下常是「'+esc(s.chain.below)+'」。</div>';
  return h+'</div>'+nav(0,'下一步 →',S.a.story==null);}
 if(id==='ido'){
  h+='<div class="q">先看自己。'+esc(s.triggerForParent)+'</div><p class="mut">當下，我的情緒強度是？</p><div class="three" style="grid-template-columns:repeat(5,1fr)">'
  +[1,2,3,4,5].map(n=>'<button class="layerbtn '+(S.a.scale===n?'chosen':'')+'" style="background:var(--track)" data-pick="scale" data-v="'+n+'">'+n+'</button>').join('')+'</div><div class="mut" style="display:flex;justify-content:space-between"><span>很平靜</span><span>很激動</span></div>';
  if(S.a.scale)h+='<div class="note">'+(S.a.scale>=4?'強度 '+S.a.scale+'：這時先照顧自己，再回到孩子身上最有效。':'強度 '+S.a.scale+'：還能對話的狀態。')+'<br><b>示範做法：</b>'+esc(s.idoModel)+'</div>'
   +'<label for="ido">我通常會怎麼做？一句話就好（只存在這個頁面）</label><textarea id="ido" rows="2" placeholder="例如：我先深呼吸，再問他發生了什麼事">'+esc(S.a.ido||'')+'</textarea>';
  return h+'</div>'+nav(0,'下一步 →',!S.a.scale);}
 if(id==='guess'){
  const n=S.a.g||0;
  h+='<div class="q">換成孩子的角度：'+esc(au.example)+'</div>'+ice('孩子的冰山',au.childIceberg,n+1)
  +'<div class="note">'+(n===0?'先看水面上的行為。請猜猜：這個行為底下，孩子可能是什麼感受與需要？':n===1?'再猜猜最深處，孩子相信著什麼？':'完整的冰山。注意：水面上的行為，只是整個故事的一角。')+'</div>'
  +(n<2?'<button class="primary" data-act="reveal">揭曉'+(n===0?'「感受與需求」':'「價值信念」')+'</button>':'');
  h+='<h3>可以這樣問孩子</h3><ul>'+au.youDoQuestions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ul>';
  return h+'</div>'+nav(0,'下一步 →',n<2);}
 if(id==='match'){
  if(!S.a.items)S.a.items=shuffle(ICE.map(l=>({text:au.childIceberg[l.id],ans:l.id,done:false})));
  const it=S.a.items,ok=it.filter(x=>x.done).length;
  h+='<div class="q">這三句話，分別放在冰山的哪一層？</div><div class="scorebar"><span>已完成 <b>'+ok+'/3</b></span><span>嘗試 <b>'+(S.a.tries||0)+'</b> 次</span></div>'
  +it.map((x,i)=>'<div class="card" style="margin:10px 0;padding:14px 16px"><div style="margin-bottom:10px">'+esc(x.text)+'</div>'+(x.done?chipI(x.ans,'✓ '+ICE.find(l=>l.id===x.ans).label):'<div class="three">'+ICE.map(l=>'<button class="layerbtn" style="'+iceBg(l.id)+';border:1px solid var(--line)" data-act="place" data-i="'+i+'" data-l="'+l.id+'">'+esc(l.label)+'</button>').join('')+'</div>')+'</div>').join('');
  return h+'</div>'+nav(0,'下一步 →',ok<3);}
 if(id==='order'){
  if(!S.a.pool){S.a.pool=shuffle(F.map(f=>f.id));S.a.placed=[];S.a.miss=0;}
  const pl=S.a.placed;
  h+='<div class="q">和孩子對話時，這四句話要依什麼順序說？</div><p class="mut">依序點出「第 1、2、3、4 步」。放對了，它的顏色和名稱才會出現。</p><div class="slots">'
  +[0,1,2,3].map(i=>{const f=pl[i]?F.find(x=>x.id===pl[i]):null;return '<div class="slot '+(f?'ok':'')+'" '+(f?'style="--c:var(--f-'+f.id+')"':'')+'><b>'+(i+1)+'</b><span>'+(f?'<b style="all:unset;font-weight:700">'+esc(f.label)+'</b>　'+esc(s.wedoScript[f.id]||f.prompt):'')+'</span></div>';}).join('')+'</div>'
  +'<div class="pool">'+S.a.pool.map(id=>{const f=F.find(x=>x.id===id),used=pl.indexOf(id)>-1;return '<button class="choice '+(used?'used':'')+'" '+(used?'disabled':'')+' data-act="f4" data-f="'+id+'">'+esc(f.prompt)+'</button>';}).join('')+'</div>'
  +(S.a.miss?'<p class="mut">放錯 '+S.a.miss+' 次。提示：先還原事實，才有資格談感受。</p>':'');
  if(pl.length===4)h+='<div class="note">順序是：<b>Facts → Feelings → Findings → Future</b>。先事實，再感受，再一起找原因，最後訂約定。</div>';
  return h+'</div>'+nav(0,'下一步 →',pl.length<4);}
 if(id==='commit'){
  const opts=[{k:'a',t:au.future,tag:'建議的約定'},{k:'b',t:s.chain.agreement,tag:'重點：'+s.chain.skill}];
  h+='<div class="q">最後一步：選一個明天就能做的小約定</div><div class="choices">'
  +opts.map(o=>'<button class="choice '+(S.a.pk===o.k?'right':'')+'" data-pick="pk" data-v="'+o.k+'"><small>'+esc(o.tag)+'</small>'+esc(o.t)+'</button>').join('')
  +'<button class="choice '+(S.a.pk==='c'?'right':'')+'" data-pick="pk" data-v="c"><small>用自己的話寫</small>'+(S.a.pk==='c'?'<textarea id="mine" rows="2" onclick="event.stopPropagation()" placeholder="寫下時間、地點、誰、做什麼">'+esc(S.a.mine||'')+'</textarea>':'點這裡自己寫')+'</button></div>'
  +'<label for="when">什麼時候開始？</label><select id="when">'+['今天晚上','明天','這個週末','下週一'].map(w=>'<option '+(S.a.when===w?'selected':'')+'>'+w+'</option>').join('')+'</select>';
  return h+'</div>'+nav(0,'完成，看約定卡',!S.a.pk);}
 if(id==='done'){
  const txt=summary(s,au);
  h+='<div class="q">我的約定卡</div><div class="summary" id="sumtxt">'+esc(txt)+'</div><div class="scorebar"><span>冰山分層嘗試 <b>'+(S.a.tries||0)+'</b> 次</span><span>4F 排序放錯 <b>'+(S.a.miss||0)+'</b> 次</span></div>'
  +'<div class="row2"><button class="primary" data-act="copy">複製約定卡</button><button data-act="print">列印</button><button data-act="again">再練一個情境</button><button data-act="games">去玩小遊戲</button></div><p class="mut" id="copied"></p></div>';
  return h;}
}
function summary(s,au){
 const pk=S.a.pk,ag=pk==='a'?au.future:pk==='b'?s.chain.agreement:(S.a.mine||'（自己寫）');
 return '【親子約定卡】'+s.title+'（'+fw.audiences[S.aud].label+'）\n\n'
 +'孩子的冰山\n・行為：'+au.childIceberg.behavior+'\n・感受與需求：'+au.childIceberg.feeling+'\n・價值信念：'+au.childIceberg.belief+'\n\n'
 +'我的做法：'+(S.a.ido||s.idoModel)+'\n\n'
 +'我會用 4F 開口\n'+F.map(f=>'・'+f.label+'：'+(s.wedoScript[f.id]||f.prompt)).join('\n')+'\n\n'
 +'我的約定（'+(S.a.when||'明天')+'開始）\n'+ag+(s.referralNote?'\n\n提醒：'+s.referralNote:'');}

// 小遊戲
const GAMES={
 ice:{name:'冰山分層',desc:'這句話屬於冰山的哪一層？',make(){const out=[];for(let i=0;i<5;i++){const s=rnd(fw.situations),a=rnd(AUD),l=rnd(ICE);out.push({q:s.byAudience[a].childIceberg[l.id],ctx:s.title,ans:l.id,ch:ICE.map(x=>({id:x.id,label:x.label,st:iceBg(x.id)+';border:1px solid var(--line)'})),why:l.label+'：'+l.desc});}return out;}},
 f4:{name:'4F 找位置',desc:'這句話是 4F 的哪一步？',make(){const out=[];for(let i=0;i<5;i++){const s=rnd(fw.situations),f=rnd(F);out.push({q:s.wedoScript[f.id],ctx:s.title,ans:f.id,ch:F.map(x=>({id:x.id,label:x.label,st:'background:var(--f-'+x.id+');color:var(--chipfg)'})),why:f.label+'：'+f.prompt});}return out;}},
 sel:{name:'SEL 五核心',desc:'這個做法在練 SEL 的哪一個核心？',make(){const out=[];for(let i=0;i<5;i++){const s=rnd(fw.situations),c=rnd(SEL);out.push({q:s.selMap[c.id],ctx:s.title,ans:c.id,ch:SEL.map(x=>({id:x.id,label:x.label,st:'background:var(--s-'+x.id+');color:var(--chipfg)'})),why:c.label+'：'+c.desc});}return out;}}
};
function vGames(){
 if(!S.quiz)return topbar()+'<section class="home"><h1>玩一玩</h1><p class="lead">選一個遊戲，5 題。顏色在三個遊戲裡固定代表同一件事。</p><div class="big3">'
  +Object.keys(GAMES).map(k=>'<button class="bigcard" data-act="qstart" data-g="'+k+'"><b>'+GAMES[k].name+'</b><span class="d">'+GAMES[k].desc+'</span></button>').join('')+'</div></section>';
 const q=S.quiz,it=q.items[q.i];
 if(q.i>=q.items.length)return topbar()+'<div class="card" style="text-align:center"><p class="kicker">'+GAMES[q.g].name+'</p><div class="big">'+q.score+' / '+q.items.length+'</div><p>'+(q.score===5?'全對！':q.score>=3?'不錯，再玩一次會更熟。':'沒關係，答錯的地方最值得記住。')+'</p><div class="row2" style="justify-content:center"><button class="primary" data-act="qstart" data-g="'+q.g+'">再玩一次</button><button data-act="qexit">換一個遊戲</button></div></div>';
 return topbar(GAMES[q.g].name)+'<div class="progress">'+q.items.map((x,k)=>'<i class="'+(k<q.i?'done':k===q.i?'cur':'')+'"></i>').join('')+'</div><div class="card"><p class="kicker">第 '+(q.i+1)+' 題・情境：'+esc(it.ctx)+'</p><div class="q">'+esc(it.q)+'</div><p class="mut">'+GAMES[q.g].desc+'</p><div class="'+(q.g==='sel'?'five':'three')+'">'
  +it.ch.map(c=>'<button class="layerbtn '+(q.picked?(c.id===it.ans?'chosen':'dim'):'')+'" style="'+c.st+'" '+(q.picked?'disabled':'')+' data-act="qans" data-c="'+c.id+'">'+esc(c.label)+'</button>').join('')+'</div>'
  +(q.picked?'<div class="note '+(q.picked===it.ans?'':'bad')+'"><b>'+(q.picked===it.ans?'答對了！':'差一點。')+'</b> '+esc(it.why)+'</div><button class="primary" data-act="qnext">'+(q.i<q.items.length-1?'下一題 →':'看結果')+'</button>':'')+'</div>';
}

// 問卷
function ensurePicks(){fw.survey.groups.forEach(g=>{if(!S.picks[g.key])S.picks[g.key]=[];});}
function bar(col,label,p){const w=p==null?0:Math.round(p*100);return '<div class="bar2"><span class="t">'+label+'</span><span class="tr"><span class="fl" style="width:'+w+'%;background:'+col+'"></span></span><span class="v">'+(p==null?'—':w+'%')+'</span></div>';}
function vSurvey(){
 ensurePicks();const spec=PF.surveySpec(fw,S.role),t=PF.tally(fw,S.resp);
 let h=topbar('不記名，只存在這個頁面')+'<div class="card"><p class="kicker">1 / 2　我是…</p><div class="row2">'+fw.survey.respondents.map(r=>'<button data-act="role" data-r="'+r.id+'" class="'+(S.role===r.id?'primary':'')+'">'+esc(r.label)+'</button>').join('')+'</div><p class="mut">'+esc(spec.stem)+'</p>';
 spec.groups.forEach(g=>{h+='<h3>'+esc(g.name)+'</h3>'+g.items.map(i=>'<label class="chk"><input type="checkbox" data-g="'+g.key+'" data-v="'+esc(i.value)+'" '+(S.picks[g.key].indexOf(i.value)>-1?'checked':'')+'>'+esc(i.text)+'</label>').join('');});
 h+='<div class="row2"><button class="primary" data-act="submit">送出這一份</button><button data-act="demo">載入示範資料</button><button data-act="clear">清除全部</button></div><p class="mut">目前：家長 '+t.parent.total+' 份、學生 '+t.student.total+' 份</p></div>';
 if(!t.parent.total&&!t.student.total)return h+'<div class="card"><p class="mut">還沒有資料。先送出一份，或按「載入示範資料」。</p></div>';
 const cmp=PF.compare(fw,t),rec=PF.recommendFromSurvey(fw,t).slice(0,3),ins=PF.insights(fw,t).slice(0,4);
 const flat=[];cmp.forEach(g=>g.items.forEach(i=>{if(!i.none)flat.push(i);}));
 flat.sort((a,b)=>((b.parentPct||0)+(b.studentPct||0))-((a.parentPct||0)+(a.studentPct||0)));
 h+='<div class="card"><p class="kicker">2 / 2　結果</p><div class="q">今天先聊這三個情境</div>'
  +rec.map((r,i)=>'<div class="rk"><span class="n">'+(i+1)+'</span><div><b>'+esc(DOMAIN[r.domain])+'・'+esc(r.title)+'</b><div class="mut">'+r.evidence.map(e=>esc(e.item)+'（家長 '+(e.parentPct==null?'—':Math.round(e.parentPct*100)+'%')+'／學生 '+(e.studentPct==null?'—':Math.round(e.studentPct*100)+'%')+'）').join('；')+'</div><button data-act="sitgo" data-s="'+r.situation+'" style="margin-top:6px">練習這個情境 →</button></div></div>').join('')+'</div>'
  +'<div class="card"><div class="q">最常被勾選的前 6 項</div><p class="mut"><span style="color:var(--teal)">■</span> 家長　<span style="color:var(--amber)">■</span> 學生</p>'
  +flat.slice(0,6).map(i=>'<div style="margin:12px 0"><div>'+esc(i.item)+(i.tag==='student_more'?' <span class="tag warn">學生更多</span>':i.tag==='parent_more'?' <span class="tag warn">家長更多</span>':'')+'</div>'+bar('var(--teal)','家長',i.parentPct)+bar('var(--amber)','學生',i.studentPct)+'</div>').join('')+'</div>'
  +'<div class="card"><div class="q">看見落差</div>'+(ins.length?'<ul>'+ins.map(x=>'<li>'+esc(x.text)+'</li>').join('')+'</ul>':'<p class="mut">兩邊很接近，或某一邊還沒有資料。</p>')+'</div>';
 return h;}

function draw(){A.innerHTML=S.view==='home'?vHome():S.view==='practice'?vPractice():S.view==='games'?vGames():vSurvey();}

A.addEventListener('input',e=>{if(e.target.id==='ido')S.a.ido=e.target.value;if(e.target.id==='mine')S.a.mine=e.target.value;});
A.addEventListener('change',e=>{const t=e.target;if(t.id==='when')S.a.when=t.value;
 if(t.dataset&&t.dataset.g){const arr=S.picks[t.dataset.g];const i=arr.indexOf(t.dataset.v);if(t.checked&&i<0)arr.push(t.dataset.v);if(!t.checked&&i>-1)arr.splice(i,1);}});
A.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.aud){S.aud=d.aud;return draw();}
 if(d.sit){S.sit=d.sit;S.a={};S.step=1;return draw();}
 if(d.pick){const v=d.pick==='pk'?d.v:Number(d.v);S.a[d.pick]=v;return draw();}
 switch(d.act){
  case 'home':S.quiz=null;return go('home');
  case 'practice':return start();
  case 'random':S.aud=S.aud||'junior';return start(rnd(fw.situations).id);
  case 'games':S.quiz=null;return go('games');
  case 'survey':return go('survey');
  case 'back':S.step=Math.max(0,S.step-1);return draw();
  case 'next':S.step=Math.min(STEPS.length-1,S.step+1);draw();return window.scrollTo({top:0});
  case 'reveal':S.a.g=(S.a.g||0)+1;return draw();
  case 'place':{const it=S.a.items[+d.i];S.a.tries=(S.a.tries||0)+1;if(it.ans===d.l){it.done=true;}else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),450);}return draw();}
  case 'f4':{const need=F[S.a.placed.length].id;if(d.f===need){S.a.placed.push(d.f);}else{S.a.miss++;b.classList.add('wrong');}return draw();}
  case 'copy':{const t=$('sumtxt').textContent;const ok=()=>{$('copied').textContent='已複製，可以貼到 LINE 或筆記。';};
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{$('copied').textContent='無法自動複製，請長按文字手動複製。';});else $('copied').textContent='無法自動複製，請長按文字手動複製。';return;}
  case 'print':return window.print();
  case 'again':return start();
  case 'qstart':S.quiz={g:d.g,items:GAMES[d.g].make(),i:0,score:0,picked:null};S.view='games';return draw();
  case 'qans':{const q=S.quiz;q.picked=d.c;if(d.c===q.items[q.i].ans)q.score++;return draw();}
  case 'qnext':S.quiz.i++;S.quiz.picked=null;return draw();
  case 'qexit':S.quiz=null;return draw();
  case 'role':S.role=d.r;return draw();
  case 'submit':{const pk={};fw.survey.groups.forEach(g=>{pk[g.key]=S.picks[g.key].slice();S.picks[g.key]=[];});S.resp.push({role:S.role,picks:pk});return draw();}
  case 'demo':S.resp=PF.demoResponses(fw,20,20);return draw();
  case 'clear':S.resp=[];fw.survey.groups.forEach(g=>S.picks[g.key]=[]);return draw();
  case 'sitgo':S.sit=d.s;S.step=1;S.a={};S.view='practice';draw();return window.scrollTo({top:0});
 }
});
draw();
const tb=$('themeToggle');if(tb)tb.addEventListener('click',function(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.textContent=dark?'☀ 淺色模式':'◐ 深色模式';this.setAttribute('aria-pressed',String(dark));this.setAttribute('aria-label',dark?'切換為淺色模式':'切換為深色模式');});
})();
</script></body></html>
