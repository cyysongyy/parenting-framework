<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>親子教育架構・練習</title>
<style>

:root{--ink:#1F2A3A;--mut:#4A5568;--line:#DDE3E1;--bg:#FBFBF8;--card:#fff;--teal:#2A7F7A;--amber:#B7791F;--red:#B5473A;--blue:#2A5C8A;--track:#E9EEF2;--chipfg:#FFFFFF;--sky:#E4EDF4;--sea:#BFD9EE}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E6EDF3;--mut:#A9B4C2;--line:#2F3B4C;--bg:#161C26;--card:#1E2733;--teal:#5FC4BD;--amber:#E9B872;--red:#F08A7E;--blue:#7DB4E6;--track:#2C3745;--chipfg:#10233A;--sky:#1A2230;--sea:#223B57}}
:root[data-theme="dark"]{--ink:#E6EDF3;--mut:#A9B4C2;--line:#2F3B4C;--bg:#161C26;--card:#1E2733;--teal:#5FC4BD;--amber:#E9B872;--red:#F08A7E;--blue:#7DB4E6;--track:#2C3745;--chipfg:#10233A;--sky:#1A2230;--sea:#223B57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',Arial,sans-serif;padding:16px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:24px;margin:4px 0 10px}
h2{font-size:18px;color:var(--teal);margin:0 0 8px}
h3{font-size:15px;margin:10px 0 4px}
label{display:block;font-size:14px;color:var(--mut);margin-top:8px}
select,button,textarea,input[type=text]{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
button{cursor:pointer;width:auto}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg button{border-radius:999px;padding:7px 16px}
.seg button.on,.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tabs button{border-radius:10px;padding:9px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.layerrow{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.layerrow small{display:block;opacity:.8}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;margin:2px 4px 2px 0;background:var(--c);color:var(--chipfg)}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.legend b{font-size:13px;color:var(--mut);margin-right:4px}
.sky{background:var(--sky);padding:10px 0 0;border-radius:12px 12px 0 0}
.sea{background:var(--sea);padding:0 0 10px;border-radius:0 0 12px 12px}
.wl{position:relative;border-top:3px dashed var(--blue);height:0}
.wl span{position:absolute;right:8px;top:-22px;font-size:12px;color:var(--blue);font-weight:700}
.band{text-align:center;font-size:14px;line-height:1.45}
.band small{display:block;font-size:12px;opacity:.85;margin-bottom:2px}
.band.b1{clip-path:polygon(24% 0,76% 0,94% 100%,6% 100%);padding:16px 17% 14px;margin:0 6%}
.band.b2{clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);padding:16px 12% 14px}
.band.b3{clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);padding:14px 16% 26px}
.f4{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.fc{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:12px;padding:12px}
.fc .fb{display:inline-block;background:var(--c);color:var(--chipfg);border-radius:999px;padding:1px 12px;font-weight:700;margin-right:6px}
.map{display:grid;grid-template-columns:auto 18px auto 18px 1fr;gap:6px 4px;align-items:center;margin:8px 0}
.map .ar{text-align:center;color:var(--mut)}
.map .box{border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700}
.sel5{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:12px;padding:12px;font-size:14px}
.sc .num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--chipfg);align-items:center;justify-content:center;font-weight:700;margin-right:6px}
.sc small{display:block;color:var(--mut);margin:4px 0}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:8px 0}
.chain div{flex:1 1 150px;background:var(--track);border-radius:10px;padding:8px 10px;font-size:14px}
.chain b{display:block;font-size:12px;color:var(--teal)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--track);color:var(--mut);margin:2px 4px 2px 0}
.tag.warn{background:#F6D8D3;color:#7A2A20}
.todo{color:var(--red);font-weight:700}
.mut{color:var(--mut);font-size:14px}
ul,ol{padding-left:20px;margin:6px 0}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.bar .t{flex:0 0 36px;color:var(--mut)}
.bar .track{flex:1;height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px}
.bar .v{flex:0 0 44px;text-align:right}
.item{margin:12px 0;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.ok{color:var(--teal);font-weight:700}.bad{color:var(--red);font-weight:700}
.hidden{display:none}
.rank{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.rank .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;text-align:center;line-height:28px;font-weight:700}

/* ── 簡化首頁與引導式流程 ── */
.app{max-width:860px;margin:0 auto;padding:6px 0 36px;outline:none}
.home{padding:30px 0 6px}
.home h1{margin:12px 0 10px}
.home .lead{font-size:15px;color:var(--mut);margin:0 0 6px}
.big3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:24px 0 18px}
.bigcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;min-height:176px;box-shadow:var(--shadow);width:100%;font-size:15px;font-weight:500;line-height:1.7;cursor:pointer}
.bigcard b{font-size:19px;font-weight:750;color:var(--ink)}
.bigcard .d{font-size:13px;color:var(--mut);font-weight:400;line-height:1.8}
.bigcard .ico{width:48px;height:48px;border-radius:15px;background:var(--soft);display:grid;place-items:center;color:var(--teal);margin-bottom:4px}
.bigcard:hover{border-color:var(--teal);transform:translateY(-2px)}
.linkrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.linkbtn{background:transparent;border:0;color:var(--teal);text-decoration:underline;padding:6px 2px;min-height:36px;font-weight:600}
.linkbtn:hover{background:transparent}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 8px}
.progress{display:flex;gap:6px;margin:4px 0 16px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--track)}
.progress i.done{background:var(--teal)}.progress i.cur{background:var(--amber)}
.kicker{font-size:12px;color:var(--teal);font-weight:700;letter-spacing:.08em;margin:0 0 6px}
.q{font-size:20px;font-weight:700;line-height:1.7;margin:4px 0 12px}
.choices{display:grid;gap:10px;margin:14px 0}
.choice{display:block;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-weight:500;font-size:15px;line-height:1.8;cursor:pointer;min-height:52px}
.choice small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.choice.right{border-color:var(--f-findings);background:var(--soft)}
.choice.wrong{border-color:var(--red);animation:shake .4s}
.choice[disabled]{cursor:default;opacity:1}
.note{border-left:5px solid var(--teal);background:var(--soft);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.85}
.note.bad{border-color:var(--red)}
.sitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.sitcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--dc);border-radius:14px;padding:14px 16px;font-weight:500;cursor:pointer;min-height:112px;width:100%}
.sitcard b{font-size:16px}.sitcard small{color:var(--mut);font-weight:400;font-size:12px;line-height:1.7}
.sitcard .tg{font-size:11px;font-weight:700;color:var(--dc)}
.star{display:inline-block;background:var(--amber);color:var(--chipfg);border-radius:999px;font-size:11px;padding:1px 8px;margin-left:6px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.slots{display:grid;gap:8px;margin:12px 0}
.slot{display:flex;gap:10px;align-items:flex-start;border:2px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:50px;font-size:14px}
.slot b{flex:0 0 28px;height:28px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:12px}
.slot.ok{border-style:solid;border-color:var(--c);background:var(--soft)}
.slot.ok b{background:var(--c);color:var(--chipfg)}
.slot.bad{border-color:var(--red)}
.pool{display:grid;gap:8px;margin:12px 0}
.pool button.used{opacity:.35}
.scorebar{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mut);margin:4px 0 12px}
.scorebar b{color:var(--ink)}

<script>// 親子教育架構 v2：依「情境 × 年段」產生六個層次的內容，並處理家長／學生問卷統計
// 用法：const plan = ParentingFramework.buildPlan(fw, { situation: 'procrastination', audience: 'junior' });
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.ParentingFramework = factory();
})(typeof self !== 'undefined' ? self : this, function () {

  const AUDIENCES = ['elementary', 'junior', 'senior'];
  const LAYER_IDS = ['behavior', 'feeling', 'belief'];

  function getSituation(fw, id) {
    const s = fw.situations.find(x => x.id === id);
    if (!s) throw new Error('找不到情境：' + id);
    return s;
  }
  function pickAudience(fw, a) { return fw.audiences[a] ? a : fw.settings.defaultAudience; }
  function selLabel(fw, id) { const x = fw.core.sel.find(s => s.id === id); return x ? x.label : id; }
  function icebergLabel(fw, id) { const x = fw.core.iceberg.layers.find(l => l.id === id); return x ? x.label : id; }

  // ───────── 六個層次的內容 ─────────
  function buildCoherence(fw, s, aud) {
    const f = fw.core;
    return {
      storyline: s.storyline,
      chain: [
        { label: '水面上（行為）', text: s.chain.surface },
        { label: '水面下（感受與需求）', text: s.chain.below },
        { label: '最深處（價值信念）', text: s.chain.deep },
        { label: '用到的能力', text: s.chain.skill },
        { label: '約定', text: s.chain.agreement }
      ],
      fourFPath: f.fourFOrder.map(id => ({
        id, step: f.fourF.find(x => x.id === id).label,
        icebergId: f.fourFToIceberg[id], iceberg: icebergLabel(fw, f.fourFToIceberg[id]),
        selIds: f.fourFToSEL[id], sel: f.fourFToSEL[id].map(x => selLabel(fw, x))
      })),
      rules: f.coherenceRules
    };
  }

  function buildIceberg(fw, s, a) {
    const v = s.byAudience[a], ic = fw.core.iceberg, qb = fw.core.questionBank[a];
    return {
      note: ic.note, layers: ic.layers, displayOrder: ic.displayOrder,
      child: v.childIceberg, parent: s.parentIceberg,
      interplay: ic.interplay, rule: ic.rule,
      depthNote: fw.audiences[a].icebergDepth,
      questions: { behavior: qb.behavior, feeling: qb.feeling, belief: qb.belief }
    };
  }

  function buildFourF(fw, s, a) {
    const f = fw.core, v = s.byAudience[a], st = fw.audiences[a].fourFStyle;
    return f.fourFOrder.map(id => {
      const meta = f.fourF.find(x => x.id === id);
      return {
        id, label: meta.label, prompt: meta.prompt, avoid: meta.avoid,
        script: id === 'future' ? v.future : s.wedoScript[id],
        stem: st[id],
        iceberg: icebergLabel(fw, f.fourFToIceberg[id]), icebergId: f.fourFToIceberg[id],
        sel: f.fourFToSEL[id].map(x => selLabel(fw, x)), selIds: f.fourFToSEL[id],
        questions: f.questionBank[a][id === 'facts' ? 'behavior' : id === 'feelings' ? 'feeling' : id === 'findings' ? 'belief' : 'future']
      };
    });
  }

  function buildStages(fw, s, a) {
    const v = s.byAudience[a];
    return fw.core.stages.map(st => {
      const base = Object.assign({}, st);
      if (st.id === 'ido') base.content = { trigger: s.triggerForParent, model: s.idoModel, experience: s.lecturerExperience, parentIceberg: s.parentIceberg };
      if (st.id === 'youdo') base.content = { example: v.example, questions: v.youDoQuestions, reasons: s.reasonsToCheck || null, referral: s.referralNote || null };
      if (st.id === 'wedo') base.content = { future: v.future, contractStyle: fw.audiences[a].contractStyle };
      return base;
    });
  }

  function buildAudience(fw, a) {
    const x = fw.audiences[a];
    return { id: a, label: x.label, grades: x.grades, developmental: x.developmental, autonomy: x.autonomy,
      parentRole: x.parentRole, language: x.language, contractStyle: x.contractStyle, cautions: x.cautions, interactionStyle: x.interactionStyle };
  }

  // ───────── 提問與互動 ─────────
  function buildInteractions(fw, sid, audience) {
    const s = getSituation(fw, sid), a = pickAudience(fw, audience), v = s.byAudience[a];
    const T = id => fw.core.interactionTemplates.find(t => t.id === id);
    const out = [];
    const pollOptions = [];
    Object.keys(s.surveyLink).forEach(g => s.surveyLink[g].forEach(item => pollOptions.push({ group: g, item })));
    out.push(Object.assign({}, T('poll'), { data: { options: pollOptions } }));
    out.push(Object.assign({}, T('ido_scale'), { data: { min: 1, max: 5, labels: ['很平靜', '很激動'] } }));
    out.push(Object.assign({}, T('ido_reflect'), { data: { model: s.idoModel, experience: s.lecturerExperience } }));
    out.push(Object.assign({}, T('youdo_guess'), { data: { example: v.example, steps: [
      { layer: 'behavior', label: '看到的行為', text: v.childIceberg.behavior },
      { layer: 'feeling', label: '感受與需求', text: v.childIceberg.feeling },
      { layer: 'belief', label: '價值信念', text: v.childIceberg.belief }] } }));
    out.push(Object.assign({}, T('youdo_match'), { data: { layers: fw.core.iceberg.layers, items: [
      { text: v.childIceberg.behavior, answer: 'behavior' },
      { text: v.childIceberg.feeling, answer: 'feeling' },
      { text: v.childIceberg.belief, answer: 'belief' }] } }));
    out.push(Object.assign({}, T('youdo_roleswap'), { data: { roles: [
      { role: '孩子', hint: v.childIceberg.belief },
      { role: '家長', hint: s.parentIceberg.belief }] } }));
    out.push(Object.assign({}, T('wedo_order'), { data: { items: fw.core.fourFOrder.map((id, i) => ({
      text: id === 'future' ? v.future : s.wedoScript[id], answer: i + 1,
      label: fw.core.fourF.find(x => x.id === id).label })) } }));
    out.push(Object.assign({}, T('wedo_commit'), { data: { fields: ['時間', '地點', '誰', '做什麼'], example: v.future } }));
    out.push(Object.assign({}, T('closing_reflect'), { data: { options: fw.core.closingSteps } }));
    // 提問階梯：由水面上往水面下，再回到水面
    const qb = fw.core.questionBank[a];
    out.push({ id: 'ladder', type: 'ladder', stage: 'all', title: '提問階梯（' + fw.audiences[a].label + '）',
      instruction: '依序往水面下問，最後回到水面訂約定。',
      data: { rungs: [
        { layer: '行為表層', questions: qb.behavior },
        { layer: '感受與需求', questions: qb.feeling },
        { layer: '價值信念', questions: qb.belief },
        { layer: '回到水面（約定）', questions: qb.future },
        { layer: '這個情境專用', questions: v.youDoQuestions }] } });
    return out;
  }

  // ───────── 組合：整個情境 ─────────
  function buildPlan(fw, opts) {
    const s = getSituation(fw, opts.situation), a = pickAudience(fw, opts.audience);
    const rd = opts.resultsDisplay || fw.settings.resultsDisplay;
    const layers = {
      coherence: buildCoherence(fw, s, a),
      iceberg: buildIceberg(fw, s, a),
      stages: buildStages(fw, s, a),
      fourF: buildFourF(fw, s, a),
      audience: buildAudience(fw, a),
      interaction: buildInteractions(fw, s.id, a)
    };
    const extras = {
      leadIn: s.leadIn || null,
      system: s.systemView ? { layers: fw.core.systemLayers, question: fw.core.systemQuestion } : null,
      sel: fw.core.sel.map(x => ({ id: x.id, label: x.label, desc: x.desc, inThisCase: s.selMap[x.id] })),
      closing: fw.core.closingSteps,
      results: { display: rd, text: rd === 'phone' ? '家長（或學生）用手機掃描 QR Code，在自己的手機上看到大家的選項。' : '講師投影結果，大家看大螢幕，不需要看手機。' },
      referral: s.referralNote || null
    };
    const todos = [];
    if (s.lecturerExperience && s.lecturerExperience.status === 'TODO') todos.push('講師經驗（' + s.title + '）');
    if (s.id === 'phone_conflict' || s.id === 'procrastination') todos.push('3C 定義');
    return { situation: s.id, title: s.title, domain: s.domain, audience: a, audienceLabel: fw.audiences[a].label,
      example: s.byAudience[a].example, layers, extras, todos, deck: opts.deck || fw.settings.deckVariant };
  }

  // ───────── 問卷：家長／學生 ─────────
  function surveySpec(fw, role) {
    const resp = fw.survey.respondents.find(r => r.id === role) || fw.survey.respondents[0];
    return { role: resp.id, label: resp.label, stem: resp.stem,
      groups: fw.survey.groups.map(g => ({ key: g.key, name: g.name,
        items: g.items.map(item => ({ value: item, text: resp.id === 'student' ? fw.survey.studentItems[item] : item, none: fw.survey.noneItems.indexOf(item) > -1 })) })),
      optionalQuestions: fw.survey.optionalQuestions };
  }

  function emptyTally(fw) {
    const t = {};
    fw.survey.respondents.forEach(r => { t[r.id] = { total: 0, counts: {} }; });
    return t;
  }

  // responses: [{ role: 'parent'|'student', picks: { emotion: [...], behavior: [...], social: [...] } }]
  function tally(fw, responses) {
    const t = emptyTally(fw);
    const valid = {};
    fw.survey.groups.forEach(g => g.items.forEach(i => { valid[g.key + '|' + i] = true; }));
    (responses || []).forEach(r => {
      if (!t[r.role]) return;
      t[r.role].total++;
      fw.survey.groups.forEach(g => (r.picks && r.picks[g.key] || []).forEach(item => {
        if (!valid[g.key + '|' + item]) return;
        const k = g.key + '|' + item;
        t[r.role].counts[k] = (t[r.role].counts[k] || 0) + 1;
      }));
    });
    return t;
  }

  function pct(t, role, group, item) {
    const total = t[role].total; if (!total) return null;
    return (t[role].counts[group + '|' + item] || 0) / total;
  }

  // 家長與學生並排比較，標出落差
  function compare(fw, t) {
    const th = fw.survey.gapThreshold;
    return fw.survey.groups.map(g => ({ key: g.key, name: g.name, items: g.items.map(item => {
      const p = pct(t, 'parent', g.key, item), st = pct(t, 'student', g.key, item);
      const none = fw.survey.noneItems.indexOf(item) > -1;
      let gap = null, tag = 'na';
      if (p !== null && st !== null) {
        gap = st - p;
        tag = none ? 'aligned' : gap >= th ? 'student_more' : gap <= -th ? 'parent_more' : 'aligned';
      }
      return { item, studentText: fw.survey.studentItems[item], none,
        parentCount: t.parent.counts[g.key + '|' + item] || 0, studentCount: t.student.counts[g.key + '|' + item] || 0,
        parentPct: p, studentPct: st, gap, tag };
    }) }));
  }

  function fmt(x) { return Math.round(x * 100) + '%'; }

  function insights(fw, t) {
    const out = [];
    compare(fw, t).forEach(g => g.items.forEach(i => {
      if (i.tag === 'student_more') out.push({ tag: i.tag, group: g.name, item: i.item,
        text: '學生勾選「' + i.studentText + '」（' + fmt(i.studentPct) + '）高於家長勾選（' + fmt(i.parentPct) + '）：孩子的感受，家長可能還沒看見。' });
      if (i.tag === 'parent_more') out.push({ tag: i.tag, group: g.name, item: i.item,
        text: '家長勾選「' + i.item + '」（' + fmt(i.parentPct) + '）高於學生勾選（' + fmt(i.studentPct) + '）：家長很擔心，但孩子不一定這樣覺得。' });
    }));
    return out.sort((a, b) => a.tag.localeCompare(b.tag));
  }

  // 依問卷結果，把八個情境排序：兩邊的勾選比例 + 落差加權
  function recommendFromSurvey(fw, t, opts) {
    opts = opts || {};
    const cmp = compare(fw, t), flat = {};
    cmp.forEach(g => g.items.forEach(i => { flat[g.key + '|' + i.item] = i; }));
    const th = fw.survey.gapThreshold;
    const list = fw.situations.map(s => {
      let score = 0; const evidence = [];
      Object.keys(s.surveyLink).forEach(g => s.surveyLink[g].forEach(item => {
        const e = flat[g + '|' + item]; if (!e || e.none) return;
        const p = e.parentPct || 0, st = e.studentPct || 0;
        let w = p + st;
        if (e.gap !== null && Math.abs(e.gap) >= th) w += Math.abs(e.gap) * 0.5;
        score += w;
        evidence.push({ group: g, item, parentPct: e.parentPct, studentPct: e.studentPct, gap: e.gap, tag: e.tag });
      }));
      return { situation: s.id, title: s.title, domain: s.domain, score: Math.round(score * 1000) / 1000, evidence };
    });
    list.sort((x, y) => y.score - x.score);
    return opts.topN ? list.slice(0, opts.topN) : list;
  }

  function toPayload(role, picks) {
    return { role, emotion: picks.emotion || [], behavior: picks.behavior || [], social: picks.social || [] };
  }

  // 示範資料（固定種子，每次產生一樣的結果）
  function demoResponses(fw, nParent, nStudent) {
    nParent = nParent || 20; nStudent = nStudent || 20;
    const rates = {
      parent: { '容易生氣、煩躁': .45, '焦慮、緊張': .35, '難過、低落': .20, '課業升學壓力大': .60, '不說出自己的感受': .50, '沒有明顯困擾': .10,
        '衝動、頂嘴': .35, '拖延、要一直催': .65, '過度使用手機網路': .75, '不遵守規範': .35, '遇到困難就逃避': .40, '沒有明顯困擾#b': .05,
        '與孩子溝通時，經常演變成責備、爭吵或冷戰': .55, '與同學容易發生爭執或意見衝突': .25, '覺得自己沒有知心朋友，或常感到被孤立': .15,
        '曾遭遇言語嘲諷、排擠、欺負或網路霸凌': .10, '不容易表達自己的想法，也不敢拒絕他人的要求': .40, '家長與教師對孩子的管教方式或期待不同': .30, '近期沒有明顯的人際互動困擾': .15 },
      student: { '容易生氣、煩躁': .30, '焦慮、緊張': .55, '難過、低落': .40, '課業升學壓力大': .70, '不說出自己的感受': .65, '沒有明顯困擾': .05,
        '衝動、頂嘴': .20, '拖延、要一直催': .55, '過度使用手機網路': .60, '不遵守規範': .25, '遇到困難就逃避': .55, '沒有明顯困擾#b': .05,
        '與孩子溝通時，經常演變成責備、爭吵或冷戰': .60, '與同學容易發生爭執或意見衝突': .30, '覺得自己沒有知心朋友，或常感到被孤立': .35,
        '曾遭遇言語嘲諷、排擠、欺負或網路霸凌': .25, '不容易表達自己的想法，也不敢拒絕他人的要求': .60, '家長與教師對孩子的管教方式或期待不同': .45, '近期沒有明顯的人際互動困擾': .10 }
    };
    let seed = 20261107;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
    const out = [];
    [['parent', nParent], ['student', nStudent]].forEach(([role, n]) => {
      for (let k = 0; k < n; k++) {
        const picks = {};
        fw.survey.groups.forEach(g => {
          picks[g.key] = g.items.filter((item, idx) => {
            const key = (item === '沒有明顯困擾' && g.key === 'behavior') ? '沒有明顯困擾#b' : item;
            return rnd() < (rates[role][key] || 0.1);
          });
        });
        out.push({ role, picks });
      }
    });
    return out;
  }

  // ───────── 一致性檢查 ─────────
  function checkCoherence(fw) {
    const errors = [], warns = [];
    const E = m => errors.push(m);
    const f = fw.core, selIds = f.sel.map(x => x.id);
    // 輔導式內容（啟發性提問與可選做法）
    (fw.situations || []).forEach(sit => {
      selIds.forEach(id => { if (!sit.selQuestions || !sit.selQuestions[id]) E(sit.id + ' 缺少 SEL 提問：' + id); });
      ['exception', 'scale', 'hope', 'resource'].forEach(k => { if (!sit.counselorQuestions || !sit.counselorQuestions[k]) E(sit.id + ' 缺少輔導提問：' + k); });
      ['facts', 'feelings', 'findings', 'future'].forEach(k => { if (!sit.wedoScript || !sit.wedoScript[k]) E(sit.id + ' 缺少 4F 句子：' + k); });
      Object.keys(sit.byAudience || {}).forEach(a => { const o = sit.byAudience[a].options; if (!o || o.length < 2) E(sit.id + '/' + a + ' 可選做法少於 2 個'); });
    });
    // core
    if (JSON.stringify(f.fourFOrder) !== JSON.stringify(f.fourF.map(x => x.id))) E('4F 順序與定義不一致');
    f.fourFOrder.forEach(id => {
      if (!f.fourFToIceberg[id] || LAYER_IDS.indexOf(f.fourFToIceberg[id]) < 0) E('4F→冰山對應缺少或不合法：' + id);
      (f.fourFToSEL[id] || []).forEach(x => { if (selIds.indexOf(x) < 0) E('4F→SEL 未知核心：' + x); });
      if (!(f.fourFToSEL[id] || []).length) E('4F→SEL 缺少：' + id);
    });
    AUDIENCES.forEach(a => {
      const x = fw.audiences[a];
      if (!x) return E('缺少年段：' + a);
      ['label', 'grades', 'developmental', 'autonomy', 'parentRole', 'icebergDepth', 'language', 'fourFStyle', 'interactionStyle', 'contractStyle', 'cautions'].forEach(k => { if (!x[k]) E('年段 ' + a + ' 缺少 ' + k); });
      f.fourFOrder.forEach(id => { if (!x.fourFStyle || !x.fourFStyle[id]) E('年段 ' + a + ' 的 4F 語氣缺 ' + id); });
      const qb = f.questionBank[a];
      if (!qb) return E('提問庫缺少年段：' + a);
      ['behavior', 'feeling', 'belief', 'future'].forEach(k => { if (!qb[k] || !qb[k].length) E('提問庫 ' + a + ' 缺 ' + k); });
    });
    // 色彩：4F、SEL、冰山每一項都要有顏色
    const col = f.colors || {};
    f.fourFOrder.forEach(id => { if (!col.fourF || !col.fourF[id]) E('缺少 4F 顏色：' + id); });
    selIds.forEach(id => { if (!col.sel || !col.sel[id]) E('缺少 SEL 顏色：' + id); });
    LAYER_IDS.forEach(id => { if (!col.iceberg || !col.iceberg[id]) E('缺少冰山顏色：' + id); });
    // survey
    const items = {};
    fw.survey.groups.forEach(g => g.items.forEach(i => { items[g.key + '|' + i] = true; if (!fw.survey.studentItems[i]) E('學生版問卷缺少：' + i); }));
    fw.survey.noneItems.forEach(i => { if (!Object.keys(items).some(k => k.split('|')[1] === i)) E('noneItems 不在問卷中：' + i); });
    ['parent', 'student'].forEach(r => { if (!fw.survey.respondents.some(x => x.id === r)) E('缺少問卷身分：' + r); });
    // situations
    const ids = {}, examples = {};
    fw.situations.forEach(s => {
      const p = s.id + '：';
      if (ids[s.id]) E('重複 id：' + s.id); ids[s.id] = true;
      ['id', 'domain', 'title', 'storyline', 'surveyLink', 'chain', 'triggerForParent', 'parentIceberg', 'idoModel', 'lecturerExperience', 'byAudience', 'wedoScript', 'selMap'].forEach(k => { if (s[k] === undefined) E(p + '缺少欄位 ' + k); });
      if (['emotion', 'behavior', 'interpersonal'].indexOf(s.domain) < 0) E(p + 'domain 不合法');
      ['surface', 'below', 'deep', 'skill', 'agreement'].forEach(k => { if (!s.chain || !s.chain[k]) E(p + '邏輯主線缺 ' + k); });
      LAYER_IDS.forEach(k => { if (!s.parentIceberg || !s.parentIceberg[k]) E(p + '父母冰山缺 ' + k); });
      ['facts', 'feelings', 'findings'].forEach(k => { if (!s.wedoScript || !s.wedoScript[k]) E(p + '4F 缺 ' + k); });
      selIds.forEach(k => { if (!s.selMap || !s.selMap[k]) E(p + 'SEL 對應缺 ' + k); });
      Object.keys(s.surveyLink || {}).forEach(g => (s.surveyLink[g] || []).forEach(i => { if (!items[g + '|' + i]) E(p + '問卷連結不存在：' + g + '／' + i); }));
      if (!Object.keys(s.surveyLink || {}).length) E(p + '沒有連結任何問卷選項');
      const seen = {};
      AUDIENCES.forEach(a => {
        const v = s.byAudience && s.byAudience[a];
        if (!v) return E(p + '缺少年段內容 ' + a);
        ['example', 'future'].forEach(k => { if (!v[k]) E(p + a + ' 缺 ' + k); });
        LAYER_IDS.forEach(k => { if (!v.childIceberg || !v.childIceberg[k]) E(p + a + ' 孩子冰山缺 ' + k); });
        if (!v.youDoQuestions || v.youDoQuestions.length < 2) E(p + a + ' 提問少於 2 題');
        if (seen[v.example]) E(p + '不同年段的例子重複'); seen[v.example] = true;
        if (examples[v.example]) warns.push(p + '例子與 ' + examples[v.example] + ' 重複'); examples[v.example] = s.id + '/' + a;
      });
    });
    // 實際產生一次，確認每個情境×年段都能組出完整六層與必要互動
    const need = ['poll', 'scale', 'reflect', 'guess', 'match', 'roleswap', 'order', 'commit', 'ladder'];
    fw.situations.forEach(s => AUDIENCES.forEach(a => {
      try {
        const plan = buildPlan(fw, { situation: s.id, audience: a });
        ['coherence', 'iceberg', 'stages', 'fourF', 'audience', 'interaction'].forEach(l => { if (!plan.layers[l]) E(s.id + '/' + a + ' 缺少層次 ' + l); });
        const types = plan.layers.interaction.map(x => x.type);
        need.forEach(t => { if (types.indexOf(t) < 0) E(s.id + '/' + a + ' 缺少互動 ' + t); });
        plan.layers.fourF.forEach(x => { if (!x.script) E(s.id + '/' + a + ' 4F ' + x.id + ' 沒有內容'); });
      } catch (e) { E(s.id + '/' + a + ' 產生失敗：' + e.message); }
    }));
    // 問卷統計能跑
    try {
      const t = tally(fw, demoResponses(fw));
      if (t.parent.total !== 20 || t.student.total !== 20) E('示範問卷筆數不正確');
      if (recommendFromSurvey(fw, t).length !== fw.situations.length) E('問卷推薦數量不正確');
    } catch (e) { E('問卷統計失敗：' + e.message); }
    return { errors, warns };
  }

  return { buildPlan, buildInteractions, getSituation, surveySpec, tally, compare, insights, recommendFromSurvey, toPayload, demoResponses, checkCoherence, AUDIENCES };
});

// ── 我的問題：內建情境比對＋AI 產生 ──
function grams(t){t=String(t).replace(/[\s，。、？！「」：；（）()\-]/g,'');const o={};for(let i=0;i<t.length-1;i++)o[t.substr(i,2)]=1;return o;}
function sitBlob(x){return [x.title,x.title,x.storyline,x.chain.surface,x.chain.below,x.chain.deep,x.triggerForParent].concat(Object.keys(x.surveyLink).map(k=>x.surveyLink[k].join(' '))).concat(AUD.map(a=>x.byAudience[a].example)).join(' ');}
function doMatch(){const q=S.ask.q.trim();if(!q){S.ask.err='請先寫下你的問題。';S.ask.match=null;return draw();}
 const g=grams(q),hs=fw.situations.map(x=>grams(sitBlob(x))),df={};
 hs.forEach(h=>Object.keys(h).forEach(k=>{df[k]=(df[k]||0)+1;}));
 const w=k=>Math.log(1+fw.situations.length/(df[k]||0.5));
 let tot=0;Object.keys(g).forEach(k=>{tot+=w(k);});
 let best=null;fw.situations.forEach((x,i)=>{let n=0;Object.keys(g).forEach(k=>{if(hs[i][k])n+=w(k);});const sc=tot?n/tot:0;if(!best||sc>best.sc)best={x,sc};});
 S.ask.err='';S.ask.match=best&&best.sc>=0.3?best:{x:null,sc:best?best.sc:0};draw();}
function aiSystem(){const c=fw.core;
 return '你是一位專業的親職教育輔導講師，使用繁體中文（台灣用語）。你要依下列架構，為家長的提問產生一個完整情境，並只輸出 JSON。\n'
 +'架構：冰山三層（行為表層、感受與需求、價值信念）；SEL 五大核心（自我覺察、自我管理、社會覺察、關係技巧、負責任決定）；4F 對話順序（Facts→Feelings→Findings→Future）；I do / You do / We do。\n'
 +'輔導立場：'+c.counselorStance.map(x=>x.label+'：'+x.text).join('；')+'\n'
 +'規則：1.先看家長自己的冰山，再看孩子的。2.答案要有啟發性：用開放式提問與孩子可選的做法，不要直接給命令或診斷。3.約定要由孩子參與決定，大人也承擔。4.不做醫療或心理診斷。5.若內容涉及自傷、虐待、暴力、嚴重霸凌或安全疑慮，referralNote 必須明確建議尋求學校輔導室、專業人員或相關專線（例如 113 保護專線、1925 安心專線），不可自行處理。6.句子要具體、簡短、可以直接對孩子說。\n'
 +'JSON 欄位（全部必填）：{"title":"情境名稱(12字內)","domain":"emotion|behavior|interpersonal","storyline":"一句話主線","triggerForParent":"讓家長想一想自己的問句","parentIceberg":{"behavior":"","feeling":"","belief":""},"idoModel":"家長先處理自己的示範句","chain":{"surface":"","below":"","deep":"","skill":"用到的SEL能力","agreement":"約定摘要"},"example":"一個具體例子(貫穿全場)","childIceberg":{"behavior":"","feeling":"","belief":""},"youDoQuestions":["",""],"options":["","",""],"future":"共同訂定的約定(含孩子參與與檢討時間)","wedoScript":{"facts":"","feelings":"","findings":"","future":""},"selMap":{"self_awareness":"","self_management":"","social_awareness":"","relationship_skills":"","responsible_decision":""},"selQuestions":{"self_awareness":"","self_management":"","social_awareness":"","relationship_skills":"","responsible_decision":""},"counselorQuestions":{"exception":"","scale":"","hope":"","resource":""},"referralNote":""}';}
async function doGen(){const q=S.ask.q.trim();
 if(!q){S.ask.err='請先寫下你的問題。';return draw();}
 if(!S.ai.key){S.ask.pending=true;S.view='settings';return draw();}
 S.ask.busy=true;S.ask.err='';draw();
 const a=fw.audiences[S.aud];
 try{
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.ai.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
   body:JSON.stringify({model:S.ai.model||'claude-sonnet-5-5',max_tokens:3500,system:aiSystem(),messages:[{role:'user',content:'孩子年段：'+a.label+'（'+a.grades+'）。這個年段的特性：'+a.developmental+'　家長角色：'+a.parentRole+'\n家長的問題：'+q}]})});
  if(!r.ok){let m='';try{m=(await r.json()).error.message;}catch(e){}throw new Error(r.status===401?'API key 不正確或已失效（401）':r.status===429?'請求太頻繁或額度不足（429）':'呼叫失敗（'+r.status+'）'+(m?'：'+m:''));}
  const j=await r.json();let t=(j.content||[]).map(x=>x.text||'').join('');t=t.replace(/^[\s\S]*?(\{)/,'$1').replace(/\}[^}]*$/,'}');
  const o=JSON.parse(t);
  ['title','storyline','chain','childIceberg','parentIceberg','wedoScript','selMap','selQuestions','counselorQuestions','options','future','example'].forEach(k=>{if(o[k]==null)throw new Error('AI 回傳的格式不完整（缺少 '+k+'），請再試一次');});
  const ba={};AUD.forEach(x=>{ba[x]={example:o.example,childIceberg:o.childIceberg,youDoQuestions:o.youDoQuestions||[],options:o.options,future:o.future};});
  S.custom={id:'custom',domain:['emotion','behavior','interpersonal'].indexOf(o.domain)>-1?o.domain:'emotion',title:o.title,storyline:o.storyline,surveyLink:{},chain:o.chain,triggerForParent:o.triggerForParent||'',parentIceberg:o.parentIceberg,idoModel:o.idoModel||'',lecturerExperience:null,byAudience:ba,wedoScript:o.wedoScript,selMap:o.selMap,selQuestions:o.selQuestions,counselorQuestions:o.counselorQuestions,referralNote:o.referralNote||'若情況持續或影響安全，請尋求學校輔導室或專業協助。',aiGenerated:true,question:q,audience:S.aud};
  S.ask.busy=false;draw();
 }catch(e){S.ask.busy=false;S.ask.err=(e&&e.message)||'發生錯誤';if(/Failed to fetch|NetworkError/i.test(S.ask.err))S.ask.err='連不上 Anthropic（請確認網路連線）。';draw();}}
function vAsk(){const k=S.ask,m=k.match;
 let h=topbar('輔導者的提問')+'<div class="card"><p class="kicker">我的問題</p><h2>內建 8 個情境以外的問題，可以交給 AI 依同一套架構產生</h2><p class="mut">先比對內建情境；沒有符合，再用 AI 依冰山、SEL、4F 與輔導立場產生一個新情境，之後的每一頁都會直接使用它。目前年段：<b>'+esc(fw.audiences[S.aud].label)+'</b>（在主線頁切換）。</p>'
 +'<label for="qtext">請描述孩子的狀況（不要寫真實姓名）</label><textarea id="qtext" rows="4" placeholder="例如：孩子最近很不想參加社團，回家就關在房間，問他也只說沒事。">'+esc(k.q)+'</textarea>'
 +'<div class="row2"><button data-act="match">先比對內建情境</button><button class="primary" data-act="gen" '+(k.busy?'disabled':'')+'>'+(k.busy?'產生中，約需 20～40 秒…':'用 AI 產生')+'</button><button data-act="settings">⚙ API key 設定'+(S.ai.key?'（已設定）':'')+'</button></div>'
 +(k.err?'<div class="note bad">'+esc(k.err)+'</div>':'')+'</div>';
 if(m){h+='<div class="card"><p class="kicker">比對結果</p>'+(m.x?'<p>最接近的內建情境是：<b>'+esc(DOMAIN[m.x.domain])+'・'+esc(m.x.title)+'</b></p><div class="row2"><button class="primary" data-act="usematch" data-s="'+m.x.id+'">使用這個情境</button></div><p class="mut">如果不太像，請用 AI 產生。</p>':'<p>沒有明顯接近的內建情境，建議用 AI 產生。'+(S.ai.key?'':'需要先到「API key 設定」輸入你自己的 key。')+'</p>')+'</div>';}
 if(S.custom){h+='<div class="card"><p class="kicker">已產生的情境</p><p><b>'+esc(S.custom.title)+'</b>（'+esc(fw.audiences[S.custom.audience].label)+'）</p><p class="mut">'+esc(S.custom.storyline)+'</p><div class="note">這是 AI 依架構產生的草稿，請用輔導專業判斷後再使用。</div><div class="row2"><button class="primary" data-act="usecustom">進入講師主線</button></div></div>';}
 return h;}
function vSettings(){
 return topbar('API key 設定')+'<div class="card"><p class="kicker">API key 設定</p><h2>讓「我的問題」能呼叫 Claude</h2>'
 +'<div class="note"><b>請先看：</b>key 只存在這台裝置的瀏覽器，呼叫時只會送到 api.anthropic.com，不會上傳到這個網站。但任何能使用這個瀏覽器的人都看得到它，所以：不要在公用電腦或投影用電腦記住 key、建議使用有額度上限的專用 key、不用時按「清除」。這個頁面是公開網站，請不要把 key 貼到任何人看得到的地方。</div>'
 +'<label for="aikey">Anthropic API key</label><input type="password" id="aikey" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="'+esc(S.ai.key)+'">'
 +'<label for="aimodel">模型</label><input type="text" id="aimodel" value="'+esc(S.ai.model)+'">'
 +'<label class="chk"><input type="checkbox" id="airemember" '+(S.ai.remember?'checked':'')+'>記住在這台裝置（沒勾選時，關閉分頁就會清除）</label>'
 +'<div class="row2"><button class="primary" data-act="savekey">儲存</button><button data-act="clearkey">清除 key</button></div>'
 +'<p class="mut">沒有 key 時，內建的 8 個情境、問卷統計與約定卡都能正常使用，只有「用 AI 產生」需要 key。</p></div>';}

// 問卷
function ensurePicks(){fw.survey.groups.forEach(g=>{if(!S.picks[g.key])S.picks[g.key]=[];});}
function bar(col,label,p){const w=p==null?0:Math.round(p*100);return '<div class="bar2"><span class="t">'+label+'</span><span class="tr"><span class="fl" style="width:'+w+'%;background:'+col+'"></span></span><span class="v">'+(p==null?'—':w+'%')+'</span></div>';}
function vSurvey(){
 ensurePicks();const spec=PF.surveySpec(fw,S.role),t=PF.tally(fw,S.resp);
 let h=topbar('不記名，只存在這個頁面')+'<div class="card"><p class="kicker">1 / 2　我是…</p><div class="row2">'+fw.survey.respondents.map(r=>'<button data-act="role" data-r="'+r.id+'" class="'+(S.role===r.id?'primary':'')+'">'+esc(r.label)+'</button>').join('')+'</div><p class="mut">'+esc(spec.stem)+'</p>';
 spec.groups.forEach(g=>{h+='<h3>'+esc(g.name)+'</h3>'+g.items.map(i=>'<label class="chk"><input type="checkbox" data-g="'+g.key+'" data-v="'+esc(i.value)+'" '+(S.picks[g.key].indexOf(i.value)>-1?'checked':'')+'>'+esc(i.text)+'</label>').join('');});
 h+='<div class="row2"><button class="primary" data-act="submit">送出這一份</button><button data-act="demo">載入示範資料</button><button data-act="clear">清除全部</button></div><p class="mut">目前：家長 '+t.parent.total+' 份、學生 '+t.student.total+' 份</p></div>';
 if(!t.parent.total&&!t.student.total)return h+'<div class="card"><p class="mut">還沒有資料。先送出一份，或按「載入示範資料」。</p></div>';
 const cmp=PF.compare(fw,t),rec=PF.recommendFromSurvey(fw,t).slice(0,3),ins=PF.insights(fw,t).slice(0,4);
 const flat=[];cmp.forEach(g=>g.items.forEach(i=>{if(!i.none)flat.push(i);}));
 flat.sort((a,b)=>((b.parentPct||0)+(b.studentPct||0))-((a.parentPct||0)+(a.studentPct||0)));
 h+='<div class="card"><p class="kicker">2 / 2　結果</p><div class="q">今天先聊這三個情境</div>'
  +rec.map((r,i)=>'<div class="rk"><span class="n">'+(i+1)+'</span><div><b>'+esc(DOMAIN[r.domain])+'・'+esc(r.title)+'</b><div class="mut">'+r.evidence.map(e=>esc(e.item)+'（家長 '+(e.parentPct==null?'—':Math.round(e.parentPct*100)+'%')+'／學生 '+(e.studentPct==null?'—':Math.round(e.studentPct*100)+'%')+'）').join('；')+'</div><button data-act="sitgo" data-s="'+r.situation+'" style="margin-top:6px">練習這個情境 →</button></div></div>').join('')+'</div>'
  +'<div class="card"><div class="q">最常被勾選的前 6 項</div><p class="mut"><span style="color:var(--teal)">■</span> 家長　<span style="color:var(--amber)">■</span> 學生</p>'
  +flat.slice(0,6).map(i=>'<div style="margin:12px 0"><div>'+esc(i.item)+(i.tag==='student_more'?' <span class="tag warn">學生更多</span>':i.tag==='parent_more'?' <span class="tag warn">家長更多</span>':'')+'</div>'+bar('var(--teal)','家長',i.parentPct)+bar('var(--amber)','學生',i.studentPct)+'</div>').join('')+'</div>'
  +'<div class="card"><div class="q">看見落差</div>'+(ins.length?'<ul>'+ins.map(x=>'<li>'+esc(x.text)+'</li>').join('')+'</ul>':'<p class="mut">兩邊很接近，或某一邊還沒有資料。</p>')+'</div>';
 return h;}


function draw(){A.className='app'+(S.proj?' proj':'');A.innerHTML=S.view==='flow'?vFlow():S.view==='ask'?vAsk():S.view==='settings'?vSettings():vSurvey();}
A.addEventListener('input',e=>{const t=e.target;if(t.id==='qtext'){S.ask.q=t.value;return;}if(t.id==='aikey'){S.ai.key=t.value.trim();return;}if(t.id==='aimodel'){S.ai.model=t.value.trim();return;}if(t.tagName==='TEXTAREA'){S.mine[t.id]=t.value;if(S.view==='flow'&&ST[S.stage].id==='close'&&$('sumtxt')){const sx=sitOf(S.sit);$('sumtxt').textContent=summary(sx,sx.byAudience[S.aud],fw.audiences[S.aud]);}}});
A.addEventListener('change',e=>{const t=e.target;
 if(t.id==='sit'){S.sit=t.value;S.mine.mineag=undefined;S.opts=[];return draw();}
 if(t.id==='airemember'){S.ai.remember=t.checked;return;}
 if(t.id==='when'){S.when=t.value;return draw();}
 if(t.dataset&&t.dataset.g){const arr=S.picks[t.dataset.g];const i=arr.indexOf(t.dataset.v);if(t.checked&&i<0)arr.push(t.dataset.v);if(!t.checked&&i>-1)arr.splice(i,1);}});
A.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.aud){S.aud=d.aud;S.mine.mineag=undefined;S.opts=[];return draw();}
 if(d.stage!=null&&d.stage!==''){return setStage(+d.stage);}
 if(d.opt!=null&&d.opt!==''){const k=+d.opt,i=S.opts.indexOf(k);if(i>-1)S.opts.splice(i,1);else S.opts.push(k);const sx=sitOf(S.sit);if(S.mine.mineag==null||true){}return draw();}
 switch(d.act){
  case 'flow':S.view='flow';return draw();
  case 'prev':return setStage(S.stage-1);
  case 'next':return setStage(S.stage+1);
  case 'proj':S.proj=!S.proj;return draw();
  case 'ask':S.view='ask';draw();return window.scrollTo({top:0});
  case 'settings':S.view='settings';draw();return window.scrollTo({top:0});
  case 'savekey':saveAI();S.view=S.ask.pending?'ask':'flow';return draw();
  case 'clearkey':S.ai.key='';saveAI();return draw();
  case 'match':return doMatch();
  case 'usematch':S.sit=d.s;S.stage=0;S.view='flow';S.mine.mineag=undefined;S.opts=[];draw();return window.scrollTo({top:0});
  case 'gen':return doGen();
  case 'usecustom':S.sit='custom';S.stage=0;S.view='flow';S.mine.mineag=undefined;S.opts=[];draw();return window.scrollTo({top:0});
  case 'survey':S.view='survey';draw();return window.scrollTo({top:0});
  case 'copy':{const t=$('sumtxt').textContent,ok=()=>{$('copied').textContent='已複製，可以貼到 LINE 或筆記。';};
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{$('copied').textContent='無法自動複製，請長按文字手動複製。';});else $('copied').textContent='無法自動複製，請長按文字手動複製。';return;}
  case 'print':return window.print();
  case 'role':S.role=d.r;return draw();
  case 'submit':{const pk={};fw.survey.groups.forEach(g=>{pk[g.key]=S.picks[g.key].slice();S.picks[g.key]=[];});S.resp.push({role:S.role,picks:pk});return draw();}
  case 'demo':S.resp=PF.demoResponses(fw,20,20);return draw();
  case 'clear':S.resp=[];fw.survey.groups.forEach(g=>S.picks[g.key]=[]);return draw();
  case 'sitgo':S.sit=d.s;S.mine.mineag=undefined;S.opts=[];S.stage=0;S.view='flow';draw();return window.scrollTo({top:0});
 }
});
draw();
const tb=$('themeToggle');if(tb)tb.addEventListener('click',function(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.textContent=dark?'☀ 淺色模式':'◐ 深色模式';this.setAttribute('aria-pressed',String(dark));this.setAttribute('aria-label',dark?'切換為淺色模式':'切換為深色模式');});
})();
</script></body></html>
