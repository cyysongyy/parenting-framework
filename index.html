<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>親子教育架構</title>
<style>
:root{--ink:#1F2A3A;--mut:#4A5568;--line:#DDE3E1;--bg:#FBFBF8;--card:#fff;--teal:#2A7F7A;--amber:#B7791F;--red:#B5473A;--blue:#2A5C8A;--track:#E9EEF2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E6EDF3;--mut:#A9B4C2;--line:#2F3B4C;--bg:#161C26;--card:#1E2733;--teal:#5FC4BD;--amber:#E9B872;--red:#F08A7E;--blue:#7DB4E6;--track:#2C3745}}
:root[data-theme="dark"]{--ink:#E6EDF3;--mut:#A9B4C2;--line:#2F3B4C;--bg:#161C26;--card:#1E2733;--teal:#5FC4BD;--amber:#E9B872;--red:#F08A7E;--blue:#7DB4E6;--track:#2C3745}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',Arial,sans-serif;padding:16px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:24px;margin:4px 0 10px}
h2{font-size:18px;color:var(--teal);margin:0 0 8px}
h3{font-size:15px;margin:10px 0 4px}
label{display:block;font-size:14px;color:var(--mut);margin-top:8px}
select,button,textarea,input[type=text]{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
button{cursor:pointer;width:auto}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg button{border-radius:999px;padding:7px 16px}
.seg button.on,.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tabs button{border-radius:10px;padding:9px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.layerrow{border-left:6px solid var(--teal);background:var(--track);border-radius:8px;padding:8px 12px;margin:8px 0}
.layerrow.l2{border-color:var(--blue)}.layerrow.l3{border-color:var(--amber)}
.layerrow small{display:block;color:var(--mut)}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:8px 0}
.chain div{flex:1 1 150px;background:var(--track);border-radius:10px;padding:8px 10px;font-size:14px}
.chain b{display:block;font-size:12px;color:var(--teal)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--track);color:var(--mut);margin:2px 4px 2px 0}
.tag.warn{background:#F6D8D3;color:#7A2A20}
.todo{color:var(--red);font-weight:700}
.mut{color:var(--mut);font-size:14px}
ul,ol{padding-left:20px;margin:6px 0}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.bar .t{flex:0 0 36px;color:var(--mut)}
.bar .track{flex:1;height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px}
.bar .v{flex:0 0 44px;text-align:right}
.item{margin:12px 0;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.ok{color:var(--teal);font-weight:700}.bad{color:var(--red);font-weight:700}
.hidden{display:none}
.rank{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.rank .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;text-align:center;line-height:28px;font-weight:700}
</style></head>
<body><div class="wrap">
<h1>親子教育架構</h1>
<div class="row">
  <div style="flex:2 1 260px"><label>情境<select id="sit"></select></label></div>
  <div style="flex:1 1 200px"><label>結果顯示<select id="rd"><option value="">依設定</option><option value="projector">講師投影</option><option value="phone">家長／學生看手機</option></select></label></div>
</div>
<label>對象（孩子的年段）</label>
<div class="row seg" id="aud"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script src="generator.js"></script>
<script>
(async function(){
const fw=await fetch('framework.json').then(r=>r.json()).catch(()=>null)||window.FW_EMBED;
if(!fw){document.getElementById('view').textContent='請用 GitHub Pages 或本機伺服器開啟（直接開檔案時無法讀取 framework.json）。';return;}
const PF=window.ParentingFramework;
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={sit:fw.situations[0].id,aud:fw.settings.defaultAudience,tab:'layers',role:'parent',picks:{emotion:[],behavior:[],social:[]},responses:[],guess:0};
const TABS=[['layers','六個層次'],['interact','提問與互動'],['survey','問卷統計']];
const DOMAIN={emotion:'情緒',behavior:'行為',interpersonal:'人際'};

fw.situations.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=DOMAIN[s.domain]+'・'+s.title;$('sit').appendChild(o)});
function drawAud(){ $('aud').innerHTML=PF.AUDIENCES.map(a=>'<button data-a="'+a+'" class="'+(state.aud===a?'on':'')+'">'+esc(fw.audiences[a].label)+'</button>').join('');}
function drawTabs(){ $('tabs').innerHTML=TABS.map(t=>'<button data-t="'+t[0]+'" class="'+(state.tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('');}
function plan(){return PF.buildPlan(fw,{situation:state.sit,audience:state.aud,resultsDisplay:$('rd').value||undefined});}
function ul(a){return '<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';}
function icebergCol(title,ic,layers){
  return '<div><h3>'+title+'</h3>'+layers.map((l,i)=>'<div class="layerrow l'+(i+1)+'"><small>'+esc(l.label)+'</small>'+esc(ic[l.id])+'</div>').join('')+'</div>';}

// ───────── 層次 ─────────
function viewLayers(){
  const p=plan(),L=p.layers,c=L.coherence,ib=L.iceberg,a=L.audience;let h='';
  h+='<div class="card"><h2>範例（'+esc(p.audienceLabel)+'）</h2><p><b>'+esc(p.example)+'</b></p>'+(p.extras.leadIn?'<p class="mut">'+esc(p.extras.leadIn)+'</p>':'')+'</div>';
  h+='<div class="card"><h2>1 邏輯一貫性</h2><p>'+esc(c.storyline)+'</p><div class="chain">'+c.chain.map(x=>'<div><b>'+esc(x.label)+'</b>'+esc(x.text)+'</div>').join('')+'</div>'
   +'<h3>4F 與冰山、SEL 對應</h3><ul>'+c.fourFPath.map(x=>'<li><b>'+esc(x.step)+'</b> → '+esc(x.iceberg)+'；能力：'+esc(x.sel.join('、'))+'</li>').join('')+'</ul>'
   +'<details><summary class="mut">一致性規則</summary>'+ul(c.rules)+'</details></div>';
  h+='<div class="card"><h2>2 冰山模式</h2><p class="mut">'+esc(ib.note)+'　'+esc(ib.depthNote)+'</p><div class="grid">'+icebergCol('孩子的冰山',ib.child,ib.layers)+icebergCol('父母的冰山',ib.parent,ib.layers)+'</div>'
   +'<p><b>兩座冰山：</b>'+esc(ib.interplay)+'</p><p class="mut">'+esc(ib.rule)+'</p></div>';
  h+='<div class="card"><h2>3 I do · You do · We do</h2><div class="grid">'+L.stages.map(s=>{
    let x='<div><h3>'+esc(s.label)+'</h3><p>'+esc(s.purpose)+'</p>';
    x+='<p class="mut">講師：'+esc(s.leaderMoves.join('；'))+'<br>家長：'+esc(s.participantMoves.join('；'))+'<br>成果：'+esc(s.output)+'</p>';
    if(s.id==='ido')x+='<p>'+esc(s.content.trigger)+'</p><p>示範句：'+esc(s.content.model)+'</p><p class="'+(s.content.experience.status==='TODO'?'todo':'')+'">'+esc(s.content.experience.text)+'</p>';
    if(s.id==='youdo'){x+=ul(s.content.questions);if(s.content.reasons)x+='<p class="mut">可能的原因：'+esc(s.content.reasons.join('、'))+'</p>';}
    if(s.id==='wedo')x+='<p>'+esc(s.content.future)+'</p><p class="mut">約定方式：'+esc(s.content.contractStyle)+'</p>';
    return x+'</div>';}).join('')+'</div></div>';
  h+='<div class="card"><h2>4 4F 模式</h2>'+L.fourF.map(f=>'<div class="item"><b>'+esc(f.label)+'</b> <span class="tag">'+esc(f.iceberg)+'</span><span class="tag">'+esc(f.sel.join('、'))+'</span>'
   +'<p>'+esc(f.script)+'</p><p class="mut">'+esc(a.label)+'的說法：'+esc(f.stem)+'　避免：'+esc(f.avoid)+'</p></div>').join('')+'</div>';
  h+='<div class="card"><h2>5 對象：'+esc(a.label)+'（'+esc(a.grades)+'）</h2><p>'+esc(a.developmental)+'</p><p><b>決策權：</b>'+esc(a.autonomy)+'<br><b>家長角色：</b>'+esc(a.parentRole)+'<br><b>約定方式：</b>'+esc(a.contractStyle)+'</p><h3>說話方式</h3>'+ul(a.language)+'<h3>要避免</h3>'+ul(a.cautions)+'</div>';
  h+='<div class="card"><h2>SEL 五大核心在這個情境</h2><ul>'+p.extras.sel.map(s=>'<li><b>'+esc(s.label)+'</b>：'+esc(s.inThisCase)+'</li>').join('')+'</ul>'
   +(p.extras.system?'<h3>系統觀</h3><p>'+esc(p.extras.system.layers.join(' → '))+'<br>'+esc(p.extras.system.question)+'</p>':'')
   +'<h3>今天帶走一個行動</h3><ol>'+p.extras.closing.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'
   +'<p class="mut">'+esc(p.extras.results.text)+'</p>'+(p.extras.referral?'<p class="mut"><b>轉介提醒：</b>'+esc(p.extras.referral)+'</p>':'')+'</div>';
  if(p.todos.length)h+='<div class="card"><h2>待確認</h2><ul>'+p.todos.map(t=>'<li class="todo">'+esc(t)+'</li>').join('')+'</ul></div>';
  return h;
}

// ───────── 互動 ─────────
function shuffle(arr,seed){ const a=arr.slice();let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;
  for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  if(a.length>1&&a.every((x,i)=>x===arr[i]))a.push(a.shift());return a;}
function viewInteract(){
  const p=plan(),I=p.layers.interaction;let h='<div class="card"><h2>提問與互動（'+esc(p.audienceLabel)+'）</h2><p class="mut">互動風格：'+esc(p.layers.audience.interactionStyle)+'。範例：'+esc(p.example)+'</p></div>';
  I.forEach((it,idx)=>{
    h+='<div class="card" data-i="'+idx+'"><h2>'+esc(it.title)+'</h2><p class="mut">'+esc(it.instruction)+'</p>';
    const d=it.data;
    if(it.type==='poll')h+=d.options.map((o,i)=>'<label style="color:var(--ink)"><input type="checkbox"> '+esc(o.item)+'</label>').join('');
    if(it.type==='scale')h+='<input type="range" min="1" max="5" value="3" data-scale="'+idx+'"> <span id="sv'+idx+'">3</span>　<span class="mut">'+esc(d.labels[0])+' ←→ '+esc(d.labels[1])+'</span>';
    if(it.type==='reflect'){ if(d.model)h+='<p class="mut">示範：'+esc(d.model)+'</p>'; h+='<textarea rows="2" placeholder="用一句話寫下來"></textarea>'; if(d.options)h+=d.options.map(o=>'<label style="color:var(--ink)"><input type="radio" name="cr"> '+esc(o)+'</label>').join(''); }
    if(it.type==='guess'){ const n=state.guess; h+='<p><b>'+esc(d.example)+'</b></p>'
        +d.steps.map((s,i)=>'<div class="layerrow l'+(i+1)+'"><small>'+esc(s.label)+'</small>'+(i<=n?esc(s.text):'？')+'</div>').join('')
        +'<button class="primary" data-guess="1">'+(n>=2?'重來':'按一下（第 '+(n+2)+' 下揭曉）')+'</button>'; }
    if(it.type==='match'){ const sh=shuffle(d.items,state.sit+state.aud); h+=sh.map((x,i)=>'<div class="item"><p>'+esc(x.text)+'</p><select data-match="'+idx+'" data-ans="'+x.answer+'"><option value="">放進哪一層？</option>'+d.layers.map(l=>'<option value="'+l.id+'">'+esc(l.label)+'</option>').join('')+'</select> <span class="r"></span></div>').join('')+'<button data-check="match" data-i="'+idx+'">檢查</button>'; }
    if(it.type==='roleswap')h+=d.roles.map(r=>'<label style="color:var(--ink)">'+esc(r.role)+'會說什麼？<textarea rows="2"></textarea></label><details><summary class="mut">提示</summary><p class="mut">他心裡可能相信：'+esc(r.hint)+'</p></details>').join('');
    if(it.type==='order'){ const sh=shuffle(d.items,state.aud+state.sit+'o'); h+=sh.map(x=>'<div class="item"><p>'+esc(x.text)+'</p><select data-order="'+idx+'" data-ans="'+x.answer+'"><option value="">第幾步？</option><option>1</option><option>2</option><option>3</option><option>4</option></select> <span class="r"></span></div>').join('')+'<button data-check="order" data-i="'+idx+'">檢查</button>'; }
    if(it.type==='commit'){ h+=d.fields.map(f=>'<label style="color:var(--ink)">'+esc(f)+'<input type="text"></label>').join('')+'<p class="mut">參考：'+esc(d.example)+'</p>'; }
    if(it.type==='ladder')h+=d.rungs.map((r,i)=>'<div class="layerrow l'+(i%3+1)+'"><small>'+esc(r.layer)+'</small>'+ul(r.questions)+'</div>').join('');
    h+='</div>';
  });
  return h;
}

// ───────── 問卷統計 ─────────
function bar(color,label,pct){const w=pct==null?0:Math.round(pct*100);return '<div class="bar"><span class="t">'+label+'</span><span class="track"><span class="fill" style="display:block;width:'+w+'%;background:'+color+'"></span></span><span class="v">'+(pct==null?'—':w+'%')+'</span></div>';}
function viewSurvey(){
  const spec=PF.surveySpec(fw,state.role),t=PF.tally(fw,state.responses);
  let h='<div class="card"><h2>填問卷（不記名）</h2><div class="row seg" id="roleseg">'+fw.survey.respondents.map(r=>'<button data-role="'+r.id+'" class="'+(state.role===r.id?'on':'')+'">'+esc(r.label)+'</button>').join('')+'</div><p class="mut">'+esc(spec.stem)+'</p>';
  spec.groups.forEach(g=>{h+='<h3>'+esc(g.name)+'</h3>'+g.items.map(i=>'<label style="color:var(--ink)"><input type="checkbox" data-g="'+g.key+'" data-v="'+esc(i.value)+'" '+(state.picks[g.key].indexOf(i.value)>-1?'checked':'')+'> '+esc(i.text)+'</label>').join('');});
  h+='<div class="row" style="margin-top:12px"><button class="primary" id="submit">送出（只存在這個頁面）</button><button id="demo">載入示範資料（家長、學生各 20 份）</button><button id="clear">清除</button></div>'
   +'<p class="mut">目前：家長 '+t.parent.total+' 份、學生 '+t.student.total+' 份。要送到 Apps Script 時，格式為 '+esc(JSON.stringify(PF.toPayload(state.role,{emotion:[],behavior:[],social:[]})))+'。</p></div>';
  if(!t.parent.total&&!t.student.total){return h+'<div class="card"><p class="mut">還沒有資料。先送出一份，或載入示範資料。</p></div>';}
  const cmp=PF.compare(fw,t);
  h+='<div class="card"><h2>統計：家長 vs 學生</h2><p class="mut"><span style="color:var(--teal)">■</span> 家長　<span style="color:var(--amber)">■</span> 學生　（百分比＝該身分填寫者中勾選的比例）</p>';
  cmp.forEach(g=>{h+='<h3>'+esc(g.name)+'</h3>'+g.items.map(i=>'<div class="item"><div>'+esc(i.item)+(i.tag==='student_more'?' <span class="tag warn">學生更多</span>':i.tag==='parent_more'?' <span class="tag warn">家長更多</span>':'')+'</div>'+bar('var(--teal)','家長',i.parentPct)+bar('var(--amber)','學生',i.studentPct)+'</div>').join('');});
  h+='</div>';
  const ins=PF.insights(fw,t);
  h+='<div class="card"><h2>看見落差</h2>'+(ins.length?'<ul>'+ins.map(x=>'<li>'+esc(x.text)+'</li>').join('')+'</ul>':'<p class="mut">兩邊的選擇很接近，或某一邊還沒有資料。</p>')+'</div>';
  const rec=PF.recommendFromSurvey(fw,t);
  h+='<div class="card"><h2>今天先討論哪些情境？</h2><p class="mut">依兩邊勾選比例加總，落差大的再加分。</p>'+rec.map((r,i)=>'<div class="rank"><span class="n">'+(i+1)+'</span><div><b>'+esc(DOMAIN[r.domain])+'・'+esc(r.title)+'</b> <button data-go="'+r.situation+'">看這個情境</button><div class="mut">'+r.evidence.map(e=>esc(e.item)+'（家長 '+(e.parentPct==null?'—':Math.round(e.parentPct*100)+'%')+'／學生 '+(e.studentPct==null?'—':Math.round(e.studentPct*100)+'%')+'）').join('；')+'</div></div></div>').join('')+'</div>';
  return h;
}

function render(){ drawAud();drawTabs();$('sit').value=state.sit;
  $('view').innerHTML=state.tab==='layers'?viewLayers():state.tab==='interact'?viewInteract():viewSurvey(); }

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a){state.aud=b.dataset.a;state.guess=0;render();}
  else if(b.dataset.t){state.tab=b.dataset.t;render();}
  else if(b.dataset.guess){state.guess=state.guess>=2?0:state.guess+1;render();}
  else if(b.dataset.check){
    const sel=document.querySelectorAll('[data-'+b.dataset.check+'="'+b.dataset.i+'"]');let ok=0;
    sel.forEach(s=>{const right=(b.dataset.check==='match'?s.value:s.value)===s.dataset.ans;if(right)ok++;s.parentNode.querySelector('.r').innerHTML=right?'<span class="ok">✓ 正確</span>':'<span class="bad">✗ 再想想</span>';});
    b.insertAdjacentHTML('afterend','<span class="mut"> '+ok+' / '+sel.length+'</span>');b.remove();
  }
  else if(b.dataset.role){state.role=b.dataset.role;state.picks={emotion:[],behavior:[],social:[]};render();}
  else if(b.id==='submit'){state.responses.push({role:state.role,picks:JSON.parse(JSON.stringify(state.picks))});state.picks={emotion:[],behavior:[],social:[]};render();}
  else if(b.id==='demo'){state.responses=state.responses.concat(PF.demoResponses(fw));render();}
  else if(b.id==='clear'){state.responses=[];state.picks={emotion:[],behavior:[],social:[]};render();}
  else if(b.dataset.go){state.sit=b.dataset.go;state.tab='layers';render();window.scrollTo(0,0);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.g){const arr=state.picks[t.dataset.g],v=t.dataset.v,i=arr.indexOf(v);if(t.checked&&i<0)arr.push(v);if(!t.checked&&i>-1)arr.splice(i,1);}
  if(t.id==='sit'){state.sit=t.value;state.guess=0;render();}
  if(t.id==='rd')render();
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.scale!==undefined){document.getElementById('sv'+t.dataset.scale).textContent=t.value;}});
render();
})();
</script>
</body></html>
